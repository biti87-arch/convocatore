<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Patto del Convocatore</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
:root{
  --bg:#E8EBEE; --surface:#F6F7F8; --surface2:#DCE1E6; --line:#C6CDD4;
  --ink:#1B2028; --muted:#5E6773; --accent:#1F5C8A; --accent-ink:#FFFFFF;
  --bronze:#8A6A2E; --cond:#B3121B; --good:#2E6B4A; --warn:#9A5B12;
  --mark:#D8E6F2; --adv:#1E7A1E;
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --surface:#1B2129; --surface2:#262E38; --line:#35404C;
    --ink:#E6EAEF; --muted:#9AA5B1; --accent:#7FB6E3; --accent-ink:#0F1A24;
    --bronze:#D0AE6B; --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A;
    --mark:#22364A; --adv:#5FBF5F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1B2129; --surface2:#262E38; --line:#35404C;
  --ink:#E6EAEF; --muted:#9AA5B1; --accent:#7FB6E3; --accent-ink:#0F1A24;
  --bronze:#D0AE6B; --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A;
  --mark:#22364A; --adv:#5FBF5F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 16px 80px}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.pgSel{max-width:60vw;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:600 .85rem var(--f-body)}
.hsub{color:var(--muted);font-size:.8rem;margin-top:4px}
nav.tabs{display:flex;gap:6px;margin-top:10px}
nav.tabs button{flex:1;padding:9px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 .9rem var(--f-body);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{display:grid;gap:18px;padding-top:16px}
h2{font-family:var(--f-display);font-weight:500;font-size:1.15rem;margin:0 0 8px;letter-spacing:.03em;color:var(--bronze)}
h3{font-size:.95rem;margin:0}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.field{display:grid;gap:3px}
.field input,.field select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .95rem var(--f-mono)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.check input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;margin-top:2px}
.banner{background:var(--mark);border-radius:8px;padding:8px 12px;font-size:.85rem}
.banner.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px}
.stat b{font:500 1.3rem var(--f-mono);font-variant-numeric:tabular-nums}
.btn{padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .85rem var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--cond);border-color:var(--cond)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;cursor:pointer;color:var(--ink);font-family:var(--f-body)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.list{display:grid;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.item.locked{opacity:.5}
.item .meta{color:var(--muted);font-size:.8rem}
.tag{font:500 .7rem var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent);color:var(--accent-ink)}
.tag.cb{background:var(--bronze);color:var(--surface)}
.catHead{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 4px;gap:8px}
.sheet{display:grid;gap:12px}
.sheetHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet h2{margin:0;font-size:1.35rem;color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px}
.kv b{display:block;font:500 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
.kv small{display:block;color:var(--muted);font-size:.72rem}
.txt{font-size:.9rem}
.txt p{margin:4px 0}
.atk{display:grid;gap:4px;font-size:.9rem}
.atk .l{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-block:4px}
.atk .l span:last-child{font-family:var(--f-mono);text-align:right}
.note{font-size:.82rem;color:var(--muted)}
.warnT{color:var(--warn)}
.cond{color:var(--cond);font-weight:600}
.adv{background:var(--adv);color:#fff;padding:0 3px;border-radius:3px}
.dis{background:var(--cond);color:#fff;padding:0 3px;border-radius:3px}
.mod{color:var(--accent);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.overlay .card{width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.hp{display:flex;align-items:center;gap:6px}
.hp input{width:64px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .95rem var(--f-mono);text-align:center}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.low{background:var(--cond)}
.active{display:grid;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.search{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
details summary{cursor:pointer;font-weight:600}
.evoRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.evoRow.base{border-style:dashed}
.evoRow.bad{border-color:var(--warn)}
.evoRow select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .8rem var(--f-body);max-width:100%}
.pebar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--mark)}
.pebar b{font:600 1.1rem var(--f-mono)}
.pebar.over{background:transparent;border:1px solid var(--cond);color:var(--cond)}
@media (prefers-reduced-motion: no-preference){.overlay .card{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head>

<script>
const C = {"tabella":[{"liv":1,"dv":1,"att":2,"ba":1,"baArmi":"+1","tsB":2,"tsS":0,"pab":4,"tal":1,"arm":2,"forDes":0,"pe":5},{"liv":2,"dv":2,"att":2,"ba":2,"baArmi":"+2","tsB":3,"tsS":0,"pab":8,"tal":1,"arm":4,"forDes":1,"pe":6},{"liv":3,"dv":3,"att":3,"ba":3,"baArmi":"+3","tsB":3,"tsS":1,"pab":12,"tal":2,"arm":4,"forDes":1,"pe":7},{"liv":4,"dv":3,"att":3,"ba":3,"baArmi":"+3","tsB":3,"tsS":1,"pab":12,"tal":2,"arm":4,"forDes":1,"pe":8},{"liv":5,"dv":4,"att":3,"ba":4,"baArmi":"+4","tsB":4,"tsS":1,"pab":16,"tal":2,"arm":6,"forDes":2,"pe":9},{"liv":6,"dv":5,"att":4,"ba":5,"baArmi":"+5","tsB":4,"tsS":1,"pab":20,"tal":3,"arm":6,"forDes":2,"pe":10},{"liv":7,"dv":6,"att":4,"ba":6,"baArmi":"+6/+1","tsB":5,"tsS":2,"pab":24,"tal":3,"arm":8,"forDes":3,"pe":11},{"liv":8,"dv":6,"att":4,"ba":6,"baArmi":"+6/+1","tsB":5,"tsS":2,"pab":24,"tal":3,"arm":8,"forDes":3,"pe":12},{"liv":9,"dv":7,"att":5,"ba":7,"baArmi":"+7/+2","tsB":5,"tsS":2,"pab":28,"tal":4,"arm":8,"forDes":3,"pe":13},{"liv":10,"dv":8,"att":5,"ba":8,"baArmi":"+8/+3","tsB":6,"tsS":2,"pab":32,"tal":4,"arm":10,"forDes":4,"pe":14},{"liv":11,"dv":9,"att":5,"ba":9,"baArmi":"+9/+4","tsB":6,"tsS":3,"pab":36,"tal":5,"arm":10,"forDes":4,"pe":15},{"liv":12,"dv":9,"att":5,"ba":9,"baArmi":"+9/+4","tsB":6,"tsS":3,"pab":36,"tal":5,"arm":12,"forDes":5,"pe":16},{"liv":13,"dv":10,"att":5,"ba":10,"baArmi":"+10/+5","tsB":7,"tsS":3,"pab":40,"tal":5,"arm":12,"forDes":5,"pe":17},{"liv":14,"dv":11,"att":6,"ba":11,"baArmi":"+11/+6/+1","tsB":7,"tsS":3,"pab":44,"tal":6,"arm":12,"forDes":5,"pe":18},{"liv":15,"dv":12,"att":6,"ba":12,"baArmi":"+12/+7/+2","tsB":8,"tsS":4,"pab":48,"tal":6,"arm":14,"forDes":6,"pe":19},{"liv":16,"dv":12,"att":6,"ba":12,"baArmi":"+12/+7/+2","tsB":8,"tsS":4,"pab":48,"tal":6,"arm":14,"forDes":6,"pe":20},{"liv":17,"dv":13,"att":6,"ba":13,"baArmi":"+13/+8/+3","tsB":8,"tsS":4,"pab":52,"tal":7,"arm":16,"forDes":7,"pe":21},{"liv":18,"dv":14,"att":6,"ba":14,"baArmi":"+14/+9/+4","tsB":9,"tsS":4,"pab":56,"tal":7,"arm":16,"forDes":7,"pe":22},{"liv":19,"dv":15,"att":7,"ba":15,"baArmi":"+15/+10/+5","tsB":9,"tsS":5,"pab":60,"tal":8,"arm":16,"forDes":7,"pe":23},{"liv":20,"dv":15,"att":7,"ba":15,"baArmi":"+15/+10/+5","tsB":9,"tsS":5,"pab":60,"tal":8,"arm":18,"forDes":8,"pe":24}],"classe":[{"liv":1,"bab":0,"t":0,"r":0,"v":2,"priv":"Incantesimi, Eidolon, Evoca esterno I, Legame vitale, Dote da convocatore"},{"liv":2,"bab":1,"t":0,"r":0,"v":3,"priv":"Sensi dell’eidolon"},{"liv":3,"bab":2,"t":1,"r":1,"v":3,"priv":"Evoca esterno II, Dote da convocatore"},{"liv":4,"bab":3,"t":1,"r":1,"v":4,"priv":"Scudo alleato, Incantesimi (sostituzione)"},{"liv":5,"bab":3,"t":1,"r":1,"v":4,"priv":"Evoca esterno III, Dote da convocatore"},{"liv":6,"bab":4,"t":2,"r":2,"v":5,"priv":"Richiamo, Incantesimi (sostituzione)"},{"liv":7,"bab":5,"t":2,"r":2,"v":5,"priv":"Evoca esterno IV, Dote da convocatore"},{"liv":8,"bab":6,"t":2,"r":2,"v":6,"priv":"Trasposizione, Incantesimi (sostituzione)"},{"liv":9,"bab":6,"t":3,"r":3,"v":6,"priv":"Evoca esterno V, Dote da convocatore"},{"liv":10,"bab":7,"t":3,"r":3,"v":7,"priv":"Trasferimento evoluzionistico, Incantesimi (sostituzione)"},{"liv":11,"bab":8,"t":3,"r":3,"v":7,"priv":"Evoca esterno VI, Dote da convocatore"},{"liv":12,"bab":9,"t":4,"r":4,"v":8,"priv":"Scudo alleato superiore, Incantesimi (sostituzione)"},{"liv":13,"bab":9,"t":4,"r":4,"v":8,"priv":"Evoca esterno VII, Dote da convocatore"},{"liv":14,"bab":10,"t":4,"r":4,"v":9,"priv":"Sacrificio, Incantesimi (sostituzione)"},{"liv":15,"bab":11,"t":5,"r":5,"v":9,"priv":"Evoca esterno VIII, Dote da convocatore"},{"liv":16,"bab":12,"t":5,"r":5,"v":10,"priv":"Fusione, Incantesimi (sostituzione)"},{"liv":17,"bab":12,"t":5,"r":5,"v":10,"priv":"Evoca esterno IX, Dote da convocatore"},{"liv":18,"bab":13,"t":6,"r":6,"v":11,"priv":"Trasferimento evoluzionistico superiore, Incantesimi (sostituzione)"},{"liv":19,"bab":14,"t":6,"r":6,"v":11,"priv":"Dote da convocatore"},{"liv":20,"bab":15,"t":6,"r":6,"v":12,"priv":"Potere assoluto, Incantesimi (sostituzione)"}],"privilegi":{"Privilegi di classe":"","Incantesimi":"Grazie alla manipolazione dei venti della magia, un convocatore lancia gli incantesimi elencati nella propria lista. Ogni volta che accanto al numero degli incantesimi appare una R, significa che uno di essi sarà un incantesimo di ricerca, e cioè determinato casualmente per rappresentare i vari studi del personaggio. Gli incantesimi di ricerca vengono determinati DOPO aver scelto quelli normalmente ottenuti dal livello e devono essere segnati con una “R” sulla scheda degli incantesimi, poiché non possono essere sostituiti con l’avanzare del livello. Ogni giorno un convocatore sceglie metà degli incantesimi conosciuti (per eccesso) da lanciare a piacimento durante il giorno (quelli di livello 0 sono sempre considerati tutti preparati); gli incantesimi che non vengono scelti potranno comunque essere lanciati consumando però 2 slot incantesimo invece di 1. Per imparare o lanciare un incantesimo, un convocatore deve avere un punteggio di Carisma almeno pari a 10 + il livello dell’incantesimo. La CD di un Tiro Salvezza contro un incantesimo da convocatore è 10 + il livello dell’incantesimo + bonus di Carisma. Inoltre, un convocatore ottiene incantesimi lanciabili bonus al giorno se possiede un alto punteggio di Carisma (vedi Tabella: Modificatori di caratteristica e incantesimi bonus). Si ottengono anche incantesimi lanciabili bonus di livello 0, come fossero di 1° livello. Man mano che sale di livello, un convocatore ottiene nuovi incantesimi. – Un numero di volte al giorno pari a metà bonus di Carisma (minimo 1), un convocatore può lanciare un incantesimo usando uno slot di livello superiore rispetto a quello richiesto. Tutte le variabili dipendenti dal livello dell’incantesimo (come la CD del Tiro Salvezza) restano quelle dello slot originale. – Al 4° livello e ad ogni livello successivo pari da convocatore, un convocatore può scegliere di imparare un nuovo incantesimo al posto di uno che già conosce. L’incantesimo sostituito non può essere uno di ricerca e il suo livello deve essere identico a quello dell’incantesimo che si desidera cambiare. – Un convocatore non è soggetto al fallimento degli incantesimi da convocatore con componenti somatiche, dovuto ad armature leggere. – Gli incantesimi possono essere lanciati gratuitamente solo un certo numero di volte in base al costo dei reagenti, dopodiché ogni utilizzo extra dovrà essere pagato al prezzo indicato. Fino a 250 mo: 2 volte al giorno; da 251 mo a 500 mo: 1 volta al giorno; da 501 mo a 999 mo: 1 volta a settimana; da 1.000 mo in su, il prezzo deve essere pagato ogni volta che si lancia l’incantesimo.","Eidolon":"L’eidolon è un’entità spiritica nativa di altri piani che, a differenza dei comuni esterni evocati dai convocatori, ha una volontà ben definita. Quando combattono, sulla fronte dell’eidolon e del suo convocatore appare la medesima runa luminescente. Al 1° livello, un convocatore sceglie un eidolon a cui legarsi (vedi Creare un eidolon). Un eidolon segue le regole sottostanti: – Si può evocare il proprio eidolon a volontà, effettuando un rituale di 5 minuti. – Un eidolon scompare se il convocatore cade privo di sensi, si addormenta, muore o se il convocatore lo congeda con un’azione gratuita. – Un eidolon viene esiliato se viene ucciso, se viene bandito da un effetto (come gli incantesimi Congedo ed Esilio) o se si allontana a più di 1 km dal convocatore. Una volta esiliato, l’eidolon non può essere evocato fino all’alba del giorno seguente. – Ogni volta che un eidolon viene evocato, tutti gli incantesimi, gli effetti e le condizioni che erano attivi su di lui terminano. Se l’eidolon era scomparso, torna con i medesimi Punti Ferita di quando è scomparso. Se era stato esiliato, torna con la metà dei suoi Punti Ferita massimali.","Evoca esterno (Mag)":"Al 1° livello, come azione standard che non provoca attacchi di opportunità, un convocatore può evocare un esterno a scelta. Ogni due livelli oltre il 1°, un convocatore può evocare un esterno di livello superiore, come indicato nella Tabella del convocatore. Si può usare questa capacità per un numero di volte al giorno pari a 3 + bonus di Carisma. Le statistiche degli esterni si trovano nel Libro delle evocazioni (chiedere al DM). Gli esterni seguono le regole sottostanti: – Non è possibile evocare un esterno se il proprio eidolon è attualmente evocato. – Non è possibile evocare il medesimo esterno due volte consecutive (gli esterni sono entità molto permalose e tutte aspettano il proprio momento). – Non è possibile evocare esterni di tipo acquatico fuori dall’acqua. – Gli esterni contano come creature evocate. – Salvo diversamente indicato, gli esterni hanno un allineamento neutrale. – Gli esterni appaiono in una casella adiacente al convocatore, agiscono immediatamente e successivamente in ogni turno del convocatore. – Gli esterni permangono per 1 minuto. – Gli esterni sono comandati mentalmente dal convocatore. – Un esterno scompare se viene ucciso, se viene bandito da un incantesimo, se il convocatore lo congeda con un’azione gratuita o se evoca un nuovo esterno o il proprio eidolon. – Quando un esterno scompare, tutti gli incantesimi, gli effetti e le condizioni che aveva generato terminano immediatamente.","Legame vitale (Sop)":"Al 1° livello, un convocatore può sacrificare un qualsiasi numero di Punti Ferita per prevenire un pari ammontare di danni subiti dal proprio eidolon, virtualmente impedendo che questi venga esiliato.","Doti da convocatore":"Al 1° livello e ogni due ulteriori livelli, un convocatore ottiene una dote da convocatore a scelta. Inoltre, ai livelli appropriati un convocatore può scegliere di ottenere una dote da convocatore al posto di un talento garantito dal normale avanzamento di livello. Salvo diversamente indicato, ciascuna dote può essere selezionata una sola volta.","Sensi dell’eidolon (Sop)":"Al 2° livello, come azione standard un convocatore può percepire il gusto, l’olfatto, il tatto, l’udito e la vista del proprio eidolon. La percezione termina se l’eidolon e il convocatore si allontanano a più di 100 m l’uno dall’altro. Si può usare questa capacità per un numero di minuti al giorno pari al livello di convocatore. Questa durata non deve essere necessariamente consecutiva, ma deve essere spesa in incrementi di un minuto.","Scudo alleato":"Al 4° livello, fintanto che l’eidolon si trova entro 6 m dal convocatore, quest’ultimo ottiene bonus di scudo +2 alla CA e bonus di circostanza +2 ai Tiri Salvezza. Questi bonus non si applicano se l’eidolon è indifeso, in lotta, privo di sensi o stordito.","Richiamo (Sop)":"Al 6° livello, fintanto che l’eidolon si trova entro 36 m dal convocatore, quest’ultimo può richiamarlo come azione standard, facendolo apparire in una casella adiacente a sé o in quella più vicina possibile. Si può usare questa capacità una volta al giorno più una ogni quattro livelli oltre il 6°.","Trasposizione (Sop)":"All’8° livello, fintanto che l’eidolon si trova entro 36 m dal convocatore, quest’ultimo può spendere un uso di richiamo per scambiarsi di posto con l’eidolon.","Trasferimento evoluzionistico (Sop)":"Al 10° livello, un convocatore può ottenere fino a 2 punti evoluzione da spendere egli stesso in evoluzioni (deve soddisfarne i requisiti). I punti evoluzione così ottenuti riducono il totale di punti evoluzione disponibili all’eidolon. Un convocatore può scegliere solo evoluzioni che l’eidolon potrebbe attualmente acquisire, ma non può scegliere quelle che forniscono bonus alle caratteristiche. Ogni volta che il convocatore cambia le evoluzioni del proprio eidolon, può anch’egli cambiare le proprie o restituire all’eidolon i punti così sottratti.","Scudo alleato superiore":"Al 12° livello, i bonus forniti da scudo alleato diventano +4.","Sacrificio (Sop)":"Al 14° livello, ogni volta che un convocatore verrebbe mandato a 0 Punti Ferita o meno, può invece assegnare al proprio eidolon tutto il danno. Questo danno viene trasferito 1 punto alla volta, il che significa che non appena l’eidolon è ridotto a 0 Punti Ferita, tutti i danni rimanenti dovranno essere assegnati al convocatore.","Fusione (Sop)":"Al 16° livello, come azione standard un convocatore può toccare il proprio eidolon per fondersi con lui, equipaggiamento compreso. Gli oggetti con effetti continuativi o con attivazione mentale continuano a funzionare mentre sono così assorbiti. Durante la fusione, il convocatore è immune a qualsiasi danno ed effetto, usa i sensi dell’eidolon e può parlare attraverso la sua voce. Tutti gli incantesimi, gli effetti e le condizioni che erano attivi su di lui sono sospesi finché la fusione non ha termine, sebbene la loro durata continui a trascorrere. Durante la fusione, il convocatore può lanciare incantesimi prendendo il controllo dell’eidolon, ma ciò consumerà la relativa azione dell’eidolon stesso; qualsiasi componente materiale viene presa dall’equipaggiamento del convocatore. La fusione ha termine se il convocatore usa un’apposita azione veloce o se l’eidolon viene esiliato, ma in questo secondo caso il convocatore subisce 4d6 danni ed è assordato per 1 round. Quando la fusione ha termine, il convocatore riappare in una casella adiacente al proprio eidolon o in quella più vicina possibile. Si può usare questa capacità per 20 round al giorno. Questa durata non deve essere necessariamente consecutiva.","Trasferimento evoluzionistico superiore (Sop)":"Al 18° livello, tramite trasferimento evoluzionistico un convocatore può ottenere fino a 6 punti evoluzione. Ogni 2 punti così ottenuti riducono di 1 il totale di punti evoluzione disponibile all’eidolon.","Rituale di potere assoluto (Sop)":"Al 20° livello, un convocatore effettua un rituale che concede un grande potere, ma deve scegliere chi ne sarà il protagonista: sé stesso o il proprio eidolon. I benefici di questa scelta sono i seguenti: Il convocatore è il protagonista del rituale: come azione standard il convocatore può assumere l’aspetto del proprio eidolon, copiando ogni sua evoluzione, forma e capacità. I punteggi base di Forza, Destrezza e Costituzione del convocatore diventano uguali a quelli base dell’eidolon. Il convocatore può decidere quali oggetti trasportati vengano assorbiti dalla sua nuova forma e quali restino disponibili. Gli oggetti con effetti continuativi o con attivazione mentale continuano a funzionare mentre sono così assorbiti. Un convocatore perde la velocità, gli attacchi naturali e tutti i tratti razziali mantenendo privilegi di classe, abilità, linguaggi e talenti bonus e ottenendo le capacità concesse dalle evoluzioni del proprio eidolon. Il convocatore può porre termine alla trasformazione come azione gratuita. Si può usare questa capacità per 20 minuti al giorno. Questa durata non deve essere necessariamente consecutiva, ma deve essere spesa in incrementi di un minuto. L’eidolon è il protagonista del rituale: l’eidolon ottiene 4 punti evoluzione extra da spendere a piacimento."},"privilegiEidolon":{"Eludere":"Quando non è indifeso, un eidolon non subisce danni se supera il Tiro Salvezza su Riflessi contro un attacco che normalmente infligge la metà dei danni in caso di riuscita.","Aumento di caratteristica":"L’eidolon aumenta permanentemente di 1 un punteggio di caratteristica a scelta.","Devozione":"Un eidolon ottiene bonus morale +4 ai Tiri Salvezza contro effetti di [AMMALIAMENTO: CHARME E COMPULSIONE].","Multiattacco":"In qualsiasi momento in cui l’eidolon ha tre o più attacchi naturali, quelli secondari sono effettuati al bonus di attacco migliore −2, anziché −5. In qualsiasi momento in cui l’eidolon ha meno di tre attacchi naturali, riceve un secondo attacco con l’attacco naturale primario con penalità −5 al tiro per colpire.","Eludere migliorato":"Quando non è indifeso e utilizza eludere, l’eidolon subisce solo la metà dei danni in caso di fallimento.","Punti evoluzione":"Il numero totale di punti evoluzione a disposizione dell’eidolon, utilizzabili per ottenere una vasta gamma di attacchi, capacità e poteri (vedi più avanti). Quando un convocatore avanza di livello, il numero massimo di punti evoluzione aumenta e può spendere quelli acquisiti per cambiare il proprio eidolon. Le evoluzioni non sono permanenti e, salvo diversamente indicato, possono essere modificate quando il convocatore avanza di livello o tramite l’incantesimo Rimutare. Salvo diversamente indicato, ciascuna evoluzione può essere selezionata una sola volta. Le evoluzioni fornite gratuitamente (ad esempio da un archetipo del convocatore) non possono essere scelte nuovamente tramite i punti evoluzione, salvo che non possano essere scelte normalmente più volte.","Etica":"Un convocatore può evocare solo eidolon il cui allineamento sia al massimo a un passo di distanza dal proprio. Anche se un convocatore indirizza le azioni del proprio eidolon, questo non significa che esso sia un pupazzo che ne esegue ogni ordine senza protestare. Gli eidolon possono rifiutarsi di intraprendere azioni contrarie alla loro etica o al loro allineamento e sono pronti a rimproverare il convocatore per aver fatto loro tali richieste. Inoltre, se il convocatore dovesse cambiare allineamento in maniera tale da risultare a più di un passo da quello dell’eidolon, quest’ultimo si rifiuterà di assecondare i suoi ordini. Se un convocatore riesce a riportare il proprio allineamento in linea con quello dell’eidolon, questi tornerà al suo servizio.","Guarigione limitata":"Un eidolon non ha Punti Fatica, ma solo Punti Ferita. Un eidolon non beneficia della guarigione naturale.","Rituale protettivo":"Sebbene venga evocato, grazie a uno speciale rituale un eidolon ottiene immunità agli incantesimi e alle capacità che influenzano le creature evocate (come Protezione dal male, Controllare creature evocate, ecc.), ma è ancora soggetto a quelle che influenzano gli esterni (come Congedo, Esilio, ecc.).","Scurovisione":"L’eidolon ottiene Scurovisione 18 m.","Comunicazione":"Un eidolon parla l’ultraterran, la lingua degli esterni, oltre a tutti i linguaggi conosciuti dal proprio convocatore. Inoltre, l’eidolon e il suo convocatore possono comunicare mentalmente fintanto che si trovano entro 36 m l’uno dall’altro.","Oggetti magici":"Se un eidolon ha le appendici adatte, può utilizzare gli oggetti magici nello slot appropriato. Convocatore ed eidolon condividono gli slot degli oggetti magici e, se entrambi indossano un oggetto che occupa il medesimo slot, solo quello indossato dal convocatore rimane attivo.","Legame arcano":"Un convocatore può lanciare qualsiasi incantesimo da convocatore che abbia come bersaglio “incantatore” sul suo eidolon, lanciandolo come incantesimo di contatto a distanza. Un convocatore può lanciare incantesimi sull’eidolon anche se solitamente non hanno effetto sugli esterni. Questa capacità non permette di condividere con l’eidolon capacità magiche che non sono incantesimi, anche se funzionano come tali.","Riduzione del danno":"L’eidolon ottiene una RD/– variabile in base al livello di convocatore, come indicato nella Tabella dell’eidolon."},"forme":{"aberrante":{"nome":"Aberrante","vel":6,"tsBuoni":["t","r"],"base":["morso","massa_tentacolare","afferrare:massa_tentacolare","armatura_naturale_migliorata"],"taglia":"Piccola/media","testoBase":"Morso; Massa tentacolare → Afferrare (massa tentacolare); Armatura naturale migliorata"},"amorfo":{"nome":"Amorfo","vel":6,"tsBuoni":["t","v"],"base":["massa_tentacolare","afferrare:massa_tentacolare"],"corpoInforme":true,"taglia":"Piccola/media","testoBase":"Massa tentacolare → Afferrare (massa tentacolare); Corpo informe"},"bipede":{"nome":"Bipede","vel":9,"tsBuoni":["t","v"],"base":["arti_braccia","arti_gambe","competenza_nelle_armi_semplici"],"scelta":["artigli","schianto"],"taglia":"Piccola/media","testoBase":"Arti [braccia] → Artigli o Schianto (a scelta); Arti [gambe]; Competenza nelle armi semplici"},"quadrupede":{"nome":"Quadrupede","vel":12,"tsBuoni":["t","r"],"base":["morso","afferrare:morso","arti_gambe","arti_gambe"],"taglia":"Piccola/media","testoBase":"Morso → Afferrare (morso); Arti [gambe]; Arti [gambe]"},"serpentiforme":{"nome":"Serpentiforme","vel":6,"tsBuoni":["r","v"],"base":["morso","afferrare:morso","coda","colpo_di_coda","portata:colpo_di_coda"],"taglia":"Piccola/media","testoBase":"Morso → Afferrare (morso); Coda → Colpo di coda → Portata (colpo di coda)"},"taurico":{"nome":"Taurico","vel":12,"tsBuoni":["t","v"],"base":["arti_braccia","arti_gambe","arti_gambe"],"scelta":["artigli","schianto"],"mediaCosta":2,"taglia":"Piccola (media: 2 pe)","testoBase":"Arti [braccia] → Artigli o Schianto (a scelta); Arti [gambe]; Arti [gambe]"}},"corpoInforme":"L’eidolon è privo di arti e organi fissi: non può essere reso prono e non concede ai nemici il bonus per l’accerchiamento (non può essere fiancheggiato); può inoltre comprimersi attraverso spazi stretti come una creatura di una taglia inferiore, senza penalità. L’immunità completa a colpi critici e danni da precisione resta l’evoluzione Amorfo da 4 punti. Non avendo arti iniziali, un eidolon amorfo deve prima acquistare le evoluzioni Arti [braccia]/[gambe] per poter usare le evoluzioni che le richiedono.","tagliaPiccola":"Taglia Piccola: +2 Destrezza, −4 Forza, −2 Costituzione, +1 alla CA, +1 ai tiri per colpire, +2 Furtività, −2 alle manovre in combattimento (BMC e DMC); i danni degli attacchi vengono ridotti di conseguenza.","evoluzioni":[{"id":"addestrato","nome":"Addestrato","costo":1,"requisiti":"","testo":"L’eidolon ottiene bonus razziale +5 a un’abilità a scelta.","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata un’abilità diversa.","multi":true,"scelta":"abilita"},{"id":"afferrante","nome":"Afferrante","costo":1,"requisiti":"","testo":"L’eidolon sviluppa barbigli, ventose o altri sistemi atti a trattenere i nemici, ottenendo così +4 alle manovre per iniziare o mantenere una lotta.","speciale":"","nota":"+4 alle manovre per iniziare o mantenere una lotta"},{"id":"anfibio","nome":"Anfibio","costo":1,"requisiti":"","testo":"L'eidolon ottiene il talento Anfibio (pari a velocità su terreno).","speciale":""},{"id":"apparato_natatorio","nome":"Apparato natatorio","costo":1,"requisiti":"","testo":"L'eidolon sviluppa mani palmate, pinne o un altro sistema natatorio, ottenendo così bonus +6 m alla velocità di Nuotare.","speciale":"Questa evoluzione può essere selezionata più volte.","multi":true,"eff":{"nuotare":6}},{"id":"armatura_naturale_migliorata","nome":"Armatura naturale migliorata","costo":1,"requisiti":"","testo":"L'eidolon sviluppa una difesa naturale che gli fornisce bonus di potenziamento +2 alla CA Naturale già esistente.","speciale":"Questa evoluzione può essere selezionata una seconda volta al 10° livello di convocatore.","multi":"2@10","eff":{"caNat":2}},{"id":"artigli","nome":"Artigli","costo":1,"requisiti":"Evoluzione Arti [braccia] a cui associare questa evoluzione.","testo":"L’eidolon ottiene due attacchi primari di Artiglio che infliggono 1d4 danni.","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un’evoluzione Arti [braccia] a cui non sia già stata associata un’altra evoluzione.","req":["arti_braccia"],"multi":"per:arti_braccia","att":{"nome":"Artiglio","dado":"1d4","n":2,"tipo":"p"}},{"id":"attacchi_magici_sop","nome":"Attacchi magici (Sop)","costo":1,"requisiti":"","testo":"Gli attacchi dell'eidolon sono considerati magici. Al 10° livello di convocatore, gli attacchi dell'eidolon sono anche considerati allineati come l'allineamento del convocatore.","speciale":""},{"id":"bonus_ai_tiri_salvezza","nome":"Bonus ai Tiri Salvezza","costo":1,"requisiti":"","testo":"L’eidolon ottiene +3 ai Tiri Salvezza contro un tipo di effetto a scelta (ad esempio [PAURA], [VELENO] o [INFLUENZA MENTALE]).","speciale":"selezionabile più volte, ogni volta per un tipo di effetto diverso.","multi":true,"scelta":"effetto"},{"id":"cacciatore","nome":"Cacciatore","costo":1,"requisiti":"evoluzione Fiuto.","testo":"L’eidolon può seguire le tracce tramite l’olfatto usando Sopravvivenza e ottiene +4 alle prove per inseguire una creatura di cui ha percepito l’odore.","speciale":"","req":["fiuto"]},{"id":"cavalcatura","nome":"Cavalcatura","costo":1,"requisiti":"Forma base aberrante, quadrupede o serpentiforme.","testo":"L’eidolon può fungere da cavalcatura, ma solo per il proprio convocatore. Quando è in sella al suo eidolon, il convocatore non deve effettuare prove di Cavalcare per gestirlo ed ottiene il talento Cavalcatura ridotta (deve soddisfarne i requisiti).","speciale":"","forme":["aberrante","quadrupede","serpentiforme"]},{"id":"coda","nome":"Coda","costo":1,"requisiti":"","testo":"L’eidolon sviluppa una lunga coda che gli fornisce bonus razziale +4 Acrobazia (equilibrio).","speciale":"Questa evoluzione può essere selezionata più volte, ma per ogni coda aggiuntiva il bonus ad Acrobazia (equilibrio) aumenta di +2.","multi":true},{"id":"coda_prensile","nome":"Coda prensile","costo":1,"requisiti":"evoluzione Coda.","testo":"La coda dell’eidolon diventa abile: può riporre o recuperare un oggetto immagazzinato come azione gratuita, reggere oggetti leggeri e manipolare interruttori, leve o simili. Non può impugnare armi né essere usata per attaccare, a meno di altre evoluzioni.","speciale":"","req":["coda"]},{"id":"colpo_di_coda","nome":"Colpo di coda","costo":1,"requisiti":"Evoluzione Coda a cui associare questa evoluzione.","testo":"L’eidolon ottiene un attacco secondario di Colpo di coda che infligge 1d8 danni (attacco secondario: -5 al tiro per colpire, metà bonus di Forza al danno). Se l’eidolon effettua un solo attacco di Colpo di coda, esso è considerato un attacco naturale primario.","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un’evoluzione Coda a cui non sia già stata associata un’altra evoluzione.","req":["coda"],"multi":"per:coda","att":{"nome":"Colpo di coda","dado":"1d8","n":1,"tipo":"s"}},{"id":"competenza_nelle_armi_da_guerra","nome":"Competenza nelle armi da guerra","costo":1,"requisiti":"Evoluzione Competenza nelle armi semplici. L'eidolon ottiene il talento Competenza nelle armi da guerra.","testo":"","speciale":"","req":["competenza_nelle_armi_semplici"]},{"id":"competenza_nelle_armi_semplici","nome":"Competenza nelle armi semplici","costo":1,"requisiti":"","testo":"L'eidolon ottiene il talento Competenza nelle armi semplici.","speciale":""},{"id":"danno_naturale_migliorato","nome":"Danno naturale migliorato","costo":1,"requisiti":"Un tipo di attacco naturale posseduto.","testo":"I dadi di danno del tipo di attacco naturale scelto aumentano di una categoria (es. 1d6 → 1d8).","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un tipo di attacco naturale diverso. Il dado di danno di un attacco naturale non può essere aumentato sia da questa evoluzione sia dal talento Attacco Naturale Migliorato: i due incrementi non si cumulano sullo stesso attacco.","multi":true,"scelta":"attacco","reqAtt":true},{"id":"fiuto","nome":"Fiuto","costo":1,"requisiti":"","testo":"L’eidolon ottiene Fiuto 9 m.","speciale":"","sensi":"Fiuto 9 m"},{"id":"morso","nome":"Morso","costo":1,"requisiti":"","testo":"L'eidolon ottiene un attacco primario di Morso che infligge 1d6 danni + una volta e mezzo il bonus di Forza.","speciale":"","att":{"nome":"Morso","dado":"1d6","n":1,"tipo":"p","forza":1.5}},{"id":"portata","nome":"Portata","costo":1,"requisiti":"Un tipo di attacco naturale posseduto.","testo":"La portata del tipo di attacco naturale scelto aumenta di 1,5 m.","speciale":"","multi":true,"scelta":"attacco","reqAtt":true},{"id":"presenza_innaturale","nome":"Presenza innaturale","costo":1,"requisiti":"","testo":"Gli animali comuni non si avvicinano a meno di 3 m dall’eidolon, salvo prova di Cavalcare o Sopravvivenza con CD 25.","speciale":""},{"id":"pungiglione","nome":"Pungiglione","costo":1,"requisiti":"Evoluzione Coda a cui associare questa evoluzione.","testo":"L'eidolon sviluppa un lungo aculeo sulla sommità della coda, ottenendo un attacco primario di Pungiglione che infligge 1d6 danni.","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un’evoluzione Coda a cui non sia già stata associata un’altra evoluzione.","req":["coda"],"multi":"per:coda","att":{"nome":"Pungiglione","dado":"1d6","n":1,"tipo":"p"}},{"id":"resistenza","nome":"Resistenza","costo":1,"requisiti":"","testo":"L'eidolon sviluppa RE 5 verso un tipo di energia a scelta tra acido, elettricità, freddo o fuoco. Questa RE aumenta di 5 al 6° livello e ogni tre ulteriori livelli di convocatore.","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un tipo di energia diversa.","multi":true,"scelta":"energia"},{"id":"sanguinamento","nome":"Sanguinamento","costo":1,"requisiti":"Un tipo di attacco naturale posseduto.","testo":"Il tipo di attacco naturale scelto infligge [sanguinamento 1d6].","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un tipo di attacco naturale diverso.","multi":true,"scelta":"attacco","reqAtt":true},{"id":"sbilanciare","nome":"Sbilanciare","costo":1,"requisiti":"Evoluzione Morso.","testo":"Quando l’eidolon colpisce con un attacco di Morso una creatura di taglia pari o inferiore alla propria, come azione gratuita che non provoca attacchi di opportunità, può effettuare contro di essa una manovra di Sbilanciare. Se la manovra fallisce, l'eidolon non può essere sbilanciato a sua volta.","speciale":"","req":["morso"]},{"id":"scalare","nome":"Scalare","costo":1,"requisiti":"","testo":"L'eidolon sviluppa un efficiente sistema di scalata, ottenendo così una velocità di Scalare pari a metà velocità su terreno.","speciale":"","eff":{"scalare":"meta"}},{"id":"schianto","nome":"Schianto","costo":1,"requisiti":"Evoluzione Arti [braccia] a cui associare questa evoluzione.","testo":"L’eidolon ottiene un devastante attacco primario di Schianto che infligge 1d8 danni. Sostituzione: Se l’eidolon possiede l’evoluzione Schianto grazie alla propria forma base, può sostituirla con l’evoluzione Chele spendendo 1 solo punto evoluzione.","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un’evoluzione Arti [braccia] a cui non sia già stata associata un’altra evoluzione.","req":["arti_braccia"],"multi":"per:arti_braccia","att":{"nome":"Schianto","dado":"1d8","n":1,"tipo":"p"}},{"id":"sguardo_ipnotico","nome":"Sguardo ipnotico","costo":1,"requisiti":"","testo":"Come azione standard, l’eidolon può dirigere il proprio sguardo verso una creatura entro 9 m. La vittima deve superare un Tiro Salvezza su Volontà con CD 10 + metà Dadi Vita dell’eidolon + bonus di Carisma dell’eidolon o diventare inferma per 1 minuto. Questo è un effetto [visivo] e [influenza mentale].","speciale":"","cd":"car"},{"id":"slot_condiviso","nome":"Slot condiviso","costo":1,"requisiti":"","testo":"Se il convocatore e l’eidolon indossano oggetti magici nei medesimi slot, un singolo oggetto dell’eidolon rimane attivo.","speciale":"Questa evoluzione può essere selezionata più volte e ogni volta un singolo oggetto addizionale dell’eidolon può rimanere attivo","multi":true},{"id":"spingere","nome":"Spingere","costo":1,"requisiti":"Un tipo di attacco naturale posseduto.","testo":"Quando l’eidolon colpisce con il tipo di attacco naturale scelto una creatura di taglia pari o inferiore alla propria, come azione gratuita che non provoca attacchi di opportunità, può effettuare contro di essa una manovra di Spingere.","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un tipo di attacco naturale diverso.","multi":true,"scelta":"attacco","reqAtt":true},{"id":"tentacolo","nome":"Tentacolo","costo":1,"requisiti":"","testo":"L'eidolon sviluppa un lungo tentacolo sinuoso, ottenendo un attacco secondario di Tentacolo che infligge 1d4 danni (attacco secondario: -5 al tiro per colpire, metà bonus di Forza al danno). Se l’eidolon effettua un solo attacco di Tentacolo, esso è considerato un attacco naturale primario.","speciale":"Questa evoluzione può essere selezionata più volte.","multi":true,"att":{"nome":"Tentacolo","dado":"1d4","n":1,"tipo":"s"}},{"id":"tiri_salvezza_migliorati","nome":"Tiri Salvezza migliorati","costo":1,"requisiti":"","testo":"L'eidolon ottiene +1 ai Tiri Salvezza.","speciale":"Questa evoluzione può essere selezionata una seconda volta al 10° livello di convocatore.","multi":"2@10","eff":{"ts":1}},{"id":"trascinare","nome":"Trascinare","costo":1,"requisiti":"Un tipo di attacco naturale posseduto che abbia una portata di almeno 3 m.","testo":"Quando l’eidolon colpisce con il tipo di attacco naturale scelto una creatura di taglia pari o inferiore alla propria, come azione gratuita che non provoca attacchi di opportunità, può effettuare contro di essa una manovra di Trascinare.","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un tipo di attacco naturale diverso.","multi":true,"scelta":"attacco","reqAtt":true},{"id":"viscido","nome":"Viscido","costo":1,"requisiti":"","testo":"L’eidolon ottiene +4 Artista della fuga e +4 DMC per sfuggire alla lotta.","speciale":"","nota":"+4 Artista della fuga e +4 DMC per sfuggire alla lotta"},{"id":"vista_vitale","nome":"Vista vitale","costo":1,"requisiti":"","testo":"Come azione di movimento l’eidolon può concentrarsi su un singolo individuo in vista entro 18 m e determinare se è vivo, morto o non morto.","speciale":""},{"id":"afferrare","nome":"Afferrare","costo":2,"requisiti":"Convocatore di 7° livello.","testo":"Quando l’eidolon colpisce con il tipo di attacco naturale scelto una creatura di taglia pari o inferiore alla propria, come azione gratuita che non provoca attacchi di opportunità, può effettuare contro di essa una manovra di Afferrare. Se la manovra ha successo, l'eidolon entra in lotta con la vittima.","speciale":"","lv":7,"multi":true,"scelta":"attacco","reqAtt":true},{"id":"arti_braccia","nome":"Arti [braccia]","costo":2,"requisiti":"","testo":"L'eidolon sviluppa un paio di braccia dotate di mani che possono manipolare gli oggetti, brandire armi e fungere da requisito per altre evoluzioni.","speciale":"Questa evoluzione può essere selezionata più volte.","multi":true},{"id":"arti_gambe","nome":"Arti [gambe]","costo":2,"requisiti":"","testo":"L'eidolon sviluppa un paio di gambe o zampe che gli forniscono bonus +3 m alla velocità su terreno.","speciale":"Questa evoluzione può essere selezionata più volte.","multi":true,"eff":{"vel":3}},{"id":"attacchi_energetici_sop","nome":"Attacchi energetici (Sop)","costo":2,"requisiti":"","testo":"Si sceglie un tipo di energia tra acido, elettricità, freddo o fuoco e tutti gli attacchi naturali dell'eidolon infliggono 1d6 danni extra del tipo di energia scelto.","speciale":"Questa evoluzione può essere selezionata più volte.","multi":true,"scelta":"energia"},{"id":"aumento_di_caratteristica","nome":"Aumento di caratteristica","costo":2,"requisiti":"","testo":"L'eidolon aumenta permanentemente di 2 un punteggio di caratteristica a scelta. Costo extra: Questa evoluzione ha un costo di 4 punti quando incrementa i punteggi di Forza o Costituzione di un eidolon di taglia grande o enorme.","speciale":"Questa evoluzione può essere selezionata una volta ogni cinque livelli di convocatore, ma ogni volta deve essere associata a una caratteristica diversa.","multi":"ogni5","scelta":"caratteristica","eff":{"car":2}},{"id":"aura_innaturale","nome":"Aura innaturale","costo":2,"requisiti":"","testo":"L'eidolon ottiene bonus di circostanza +2 alla CA nei confronti degli animali.","speciale":""},{"id":"barriera_arcana","nome":"Barriera arcana","costo":2,"requisiti":"","testo":"Metà del bonus di CA Naturale totale dell’eidolon è considerato invece bonus di deviazione alla CA.","speciale":"","eff":{"barriera":true}},{"id":"chele","nome":"Chele","costo":2,"requisiti":"Evoluzione Arti [braccia] a cui associare questa evoluzione.","testo":"L’eidolon ottiene due attacchi primari di Chela che infliggono 1d6 danni. Gli eidolon che associano l'evoluzione Afferrare alle Chele ottengono bonus +2 alle manovre di Lottare. Sostituzione: Se l’eidolon possiede l’evoluzione Schianto grazie alla propria forma base, può sostituirla con l’evoluzione Chele spendendo 1 solo punto evoluzione.","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un’evoluzione Arti [braccia] a cui non sia già stata associata un’altra evoluzione.","req":["arti_braccia"],"multi":"per:arti_braccia","att":{"nome":"Chela","dado":"1d6","n":2,"tipo":"p"}},{"id":"corna","nome":"Corna","costo":2,"requisiti":"","testo":"L'eidolon sviluppa una o più escrescenze ossee, ottenendo un attacco primario di Corna che infligge 1d10 danni.","speciale":"","att":{"nome":"Corna","dado":"1d10","n":1,"tipo":"p"}},{"id":"fortificazione","nome":"Fortificazione","costo":2,"requisiti":"Convocatore di 4° livello.","testo":"L’eidolon ha il 25% di probabilità di ignorare i colpi critici e i danni da precisione.","speciale":"Questa evoluzione può essere selezionata una seconda volta al 7° livello di convocatore, portando la probabilità di ignorare al 50%.","lv":4,"multi":"2@7"},{"id":"immunita_sop","nome":"Immunità (Sop)","costo":2,"requisiti":"","testo":"L'eidolon ottiene immunità verso un tipo di energia a scelta tra acido, elettricità, freddo o fuoco.","speciale":"","multi":true,"scelta":"energia"},{"id":"magia_condivisa_mag","nome":"Magia condivisa (Mag)","costo":2,"requisiti":"","testo":"Una volta al giorno, l’eidolon può lanciare un incantesimo conosciuto (ma non necessariamente preparato) dal proprio convocatore. L’incantesimo deve essere di 1 livello inferiore a quello massimo lanciabile dal convocatore. Tutti i parametri dell’incantesimo sono calcolati sulle statistiche e sul livello del convocatore. L’incantesimo lanciato dall’eidolon non ha bisogno di soddisfare le eventuali componenti somatiche o vocali.","speciale":""},{"id":"massa_tentacolare","nome":"Massa tentacolare","costo":2,"requisiti":"","testo":"L’eidolon ottiene un attacco di Massa tentacolare che infligge 1d8 danni. Questo attacco è sempre secondario, a meno che la Massa tentacolare non sia l’unico attacco naturale dell’eidolon, nel qual caso è primario. Gli eidolon che associano l’evoluzione Afferrare alla Massa tentacolare ottengono +2 alle prove per cominciare una lotta e possono afferrare anche i nemici di una taglia superiore alla propria.","speciale":"","att":{"nome":"Massa tentacolare","dado":"1d8","n":1,"tipo":"s"}},{"id":"percezione_tellurica","nome":"Percezione tellurica","costo":2,"requisiti":"Convocatore di 7° livello. L'eidolon ottiene Percezione tellurica 9 m.","testo":"","speciale":"","lv":7,"sensi":"Percezione tellurica 9 m"},{"id":"sete_di_sangue","nome":"Sete di sangue","costo":2,"requisiti":"Convocatore di 7° livello.","testo":"Se durante un combattimento l'eidolon subisce da una singola fonte un numero di danni pari o superiore al triplo del livello del convocatore, viene colto da una sete di sangue sfrenata. Mentre è preda della sete di sangue l’eidolon ottiene vantaggio nei tiri per colpire ma, all’inizio di ogni proprio turno, ha il 5% cumulabile di probabilità di diventare affaticato e di porre termine alla sete di sangue. Dopo esser stato colto dalla sete di sangue, l’eidolon è affaticato per 10 minuti. L’eidolon non può essere colto dalla sete di sangue se è affaticato.","speciale":"","lv":7},{"id":"speroni","nome":"Speroni","costo":2,"requisiti":"Convocatore di 4° livello; Forma base quadrupede.","testo":"Quando l’eidolon effettua con successo una manovra di Lottare, può effettuare contro la vittima due attacchi primari di Sperone che infliggono 1d4 danni ciascuno. Gli attacchi forniti da questa evoluzione contano come un singolo attacco al fine di determinare il numero massimo di attacchi effettuabili dall'eidolon.","speciale":"","lv":4,"forme":["quadrupede"]},{"id":"squarciare","nome":"Squarciare","costo":2,"requisiti":"Convocatore di 4° livello; evoluzioni Artigli e Afferrare.","testo":"Quando l’eidolon inizia o mantiene con successo una lotta, effettua due attacchi di Artiglio contro la creatura Afferrata (danni pari all’Artiglio). Questi attacchi contano ai fini del numero massimo di attacchi.","speciale":"","lv":4,"req":["artigli","afferrare"]},{"id":"squartare","nome":"Squartare","costo":2,"requisiti":"Convocatore di 6° livello; Evoluzione Artigli.","testo":"Se nel proprio turno l'eidolon colpisce il medesimo nemico con almeno due attacchi di Artiglio, gli infligge un danno extra pari al danno di Artiglio + una volta e mezzo il bonus di Forza.","speciale":"","lv":6,"req":["artigli"]},{"id":"stritolare","nome":"Stritolare","costo":2,"requisiti":"Evoluzione Afferrare.","testo":"Quando l’eidolon mantiene con successo una lotta utilizzando l’evoluzione Afferrare, infligge al nemico un danno extra pari al danno dell’attacco usato per l’Afferrare. Questo danno non si applica nel round in cui la lotta ha inizio, ma a partire dal round successivo, per ogni round in cui l’eidolon continua a mantenere la lotta.","speciale":"","req":["afferrare"]},{"id":"talentuoso","nome":"Talentuoso","costo":2,"requisiti":"","testo":"L’eidolon ottiene un talento scelto tra quelli Generali o di Combattimento (deve soddisfarne i requisiti).","speciale":"","multi":true},{"id":"testa","nome":"Testa","costo":2,"requisiti":"","testo":"L’eidolon sviluppa una testa aggiuntiva che può fungere da requisito per altre evoluzioni (Morso, Sguardo ipnotico, ecc.).","speciale":"selezionabile più volte.","multi":true},{"id":"travolgere","nome":"Travolgere","costo":2,"requisiti":"","testo":"Come azione di round completo l'eidolon può tentare di calpestare le creature di taglia inferiore alla propria. Ciò funziona come una manovra di Oltrepassare, tranne per il fatto che l'eidolon deve solo spostarsi sopra gli avversari lungo il suo cammino, senza dover effettuare alcun tiro. Le creature oltrepassate subiscono 1d6 danni + una volta e mezzo il bonus di Forza. Le vittime possono effettuare un attacco di opportunità contro l’eidolon con -4 oppure possono superare un Tiro Salvezza su Riflessi con CD 10 + metà Dadi Vita dell’eidolon + bonus di Forza dell’eidolon per dimezzare i danni. Si può infliggere i danni del travolgimento a una specifica creatura una sola volta per round.","speciale":"","cd":"for"},{"id":"veleno","nome":"Veleno","costo":2,"requisiti":"Convocatore di 7° livello; Evoluzione Morso o Pungiglione a cui associare questa evoluzione.","testo":"Quando l’eidolon colpisce con l’attacco a cui è associata questa evoluzione, la vittima deve superare un Tiro Salvezza con CD 10 + metà Dadi Vita dell’eidolon + bonus di Costituzione dell’eidolon o diventa rallentata per 3 round. Costo extra: Spendendo 1 punto evoluzione addizionale, la CD del veleno di uno specifico attacco a cui è associata questa evoluzione aumenta di 2.","speciale":"","lv":7,"reqUno":["morso","pungiglione"],"cd":"cos","extra":{"nome":"CD +2","costo":1}},{"id":"balzare","nome":"Balzare","costo":3,"requisiti":"Convocatore di 7° livello; Forma base quadrupede. L'eidolon ottiene Balzare.","testo":"","speciale":"","lv":7,"forme":["quadrupede"]},{"id":"inghiottire","nome":"Inghiottire","costo":3,"requisiti":"Convocatore di 9° livello; Evoluzione Afferrare associata all’evoluzione Morso.","testo":"Se l’eidolon comincia il proprio turno con un nemico di taglia inferiore alla propria in lotta all'interno della sua bocca (vedi evoluzione Afferrare), come azione gratuita che non provoca attacchi di opportunità, può effettuare contro di lui una manovra in combattimento. Se la manovra riesce, la vittima è ingoiata e subisce i danni del Morso. Nel proprio turno, la vittima inghiottita subisce un numero di danni contundenti pari a quelli del Morso dell’eidolon +1d6. Una creatura inghiottita mantiene la condizione in lotta, ma può tentare di aprirsi una via di fuga con un'arma leggera perforante o tagliente infliggendo un numero di danni pari a 1/10 dei Punti Ferita massimali dell'eidolon. Se una creatura inghiottita riesce a fuggire, l'eidolon non può utilizzare di nuovo questa evoluzione finché il danno subito non è stato guarito. In alternativa, una creatura inghiottita può tentare di sfuggire alla lotta come di norma. Il successo indica che è risalita alla bocca dell'eidolon, dove potrà tentare di scappare o essere inghiottita di nuovo.","speciale":"","lv":9,"req":["afferrare","morso"]},{"id":"levitazione","nome":"Levitazione","costo":3,"requisiti":"","testo":"Proto-ali, membrane aerostatiche, magia… l’eidolon è dotato di un sistema di movimento che gli fornisce una velocità di Volare di 9 m (buona) ma restando a un’altezza massima di 1 m da terra.","speciale":"","eff":{"volo":9}},{"id":"mente_aliena","nome":"Mente aliena","costo":3,"requisiti":"Convocatore di 9° livello.","testo":"La mente dell'eidolon diventa pericolosamente incomprensibile per i mortali. Le creature non aberrazioni che leggono la mente dell'eidolon o entrano in contatto telepatico con esso subiscono 1d4 danni a Saggezza. Inoltre, come azione veloce l’eidolon può iniziare un contatto mentale con una creatura entro 18 per infliggerle 1d4 danni a Saggezza. La vittima può superare un Tiro Salvezza su Volontà con CD 10 + metà Dadi Vita dell’eidolon + bonus di Carisma dell’eidolon per dimezzare i danni. Se il tiro riesce, la vittima diventa immune per 24 ore a ulteriori usi di questa capacità da parte del medesimo eidolon. Un convocatore è immune alla mente aliena del proprio eidolon. Questo è un effetto di [influenza mentale].","speciale":"","lv":9,"cd":"car"},{"id":"percezione_cieca","nome":"Percezione cieca","costo":3,"requisiti":"Convocatore di 9° livello.","testo":"L’eidolon ottiene Percezione cieca 9 m.","speciale":"","lv":9,"sensi":"Percezione cieca 9 m"},{"id":"presenza_inquietante","nome":"Presenza inquietante","costo":3,"requisiti":"Convocatore di 11° livello.","testo":"Come parte di una carica o di un'azione di attacco, 'eidolon può emanare un’aura fastidiosa. Se ciò accade, gli avversari entro 9 m dall’eidolon devono superare un Tiro Salvezza su Volontà con CD 10 + metà Dadi Vita dell’eidolon + bonus di Carisma dell’eidolon o essere scossi per 3d6 round. Le creature con 4 o meno Dadi Vita rispetto all’eidolon diventano invece spaventate. Le creature con più Dadi Vita rispetto all’eidolon sono immuni a questo effetto. Questa evoluzione non cumula gli stati di paura.","speciale":"","lv":11,"cd":"car"},{"id":"ragnatela","nome":"Ragnatela","costo":3,"requisiti":"Convocatore di 7° livello.","testo":"L’eidolon sviluppa un paio di filiere che gli consentono di tessere ragnatele. Otto volte al giorno, l’eidolon può lanciare una ragnatela come attacco di contatto a distanza contro un nemico di taglia pari o inferiore alla propria. La ragnatela ha un incremento di gittata 3 m (x5). Una creatura intralciata dalla ragnatela può liberarsi superando una prova di Artista della fuga o di Forza, entrambe con -4, con una CD pari a 10 + metà Dadi Vita dell’eidolon + bonus di Costituzione dell’eidolon. La ragnatela ha Durezza 0 e un numero di Punti Ferita pari ai Dadi Vita dell'eidolon.","speciale":"","lv":7,"cd":"cos"},{"id":"sacrificio_di_sangue_sop","nome":"Sacrificio di sangue (Sop)","costo":3,"requisiti":"","testo":"Tre volte al giorno, come azione standard l'eidolon può sacrificare fino a 2 Punti Ferita per Dado Vita posseduto, per curare un alleato toccato di un numero di danni pari a metà dei Punti Ferita sacrificati.","speciale":""},{"id":"scavare","nome":"Scavare","costo":3,"requisiti":"Convocatore di 7° livello.","testo":"L’eidolon ottiene una velocità di Scavare pari a metà della propria velocità su terreno, ma solo attraverso terreno malleabile (terra, sabbia, argilla, pietrisco e simili). Mentre scava, l’eidolon deve trattenere il fiato e il terreno smosso ricade immediatamente dietro di lui, senza lasciare un tunnel.","speciale":"","lv":7,"eff":{"scavare":"meta"}},{"id":"amorfo","nome":"Amorfo","costo":4,"requisiti":"","testo":"L'eidolon sviluppa una fisionomia priva di punti deboli distinguibili, ottenendo così immunità ai colpi critici e ai danni da precisione.","speciale":""},{"id":"assorbimento_energetico_sop","nome":"Assorbimento energetico (Sop)","costo":4,"requisiti":"Convocatore di 9° livello; evoluzione Immunità (Sop) associata alla stessa energia.","testo":"Quando l’eidolon subisce danni del tipo di energia a cui è immune, invece di ignorarli recupera un numero di Punti Ferita pari alla metà dei danni che avrebbe subito, senza superare i propri Punti Ferita massimali.","speciale":"Questa evoluzione può essere selezionata più volte, ma ognuna deve essere associata a un’energia diversa a cui l’eidolon è immune.","lv":9,"multi":true,"scelta":"energia","reqImm":true},{"id":"evanescenza_sop","nome":"Evanescenza (Sop)","costo":4,"requisiti":"Convocatore di 15° livello.","testo":"Una volta al giorno, come azione veloce l’eidolon può ottenere per 5 round una probabilità di essere mancato del 45%.","speciale":"","lv":15},{"id":"guarigione","nome":"Guarigione","costo":4,"requisiti":"Convocatore di 11° livello.","testo":"Dopo essersi focalizzato per 1 minuto, l'eidolon ottiene Guarigione rapida 1. Si può curare in questo modo un massimo di danni al giorno pari ai Punti Ferita dell’eidolon.","speciale":"","lv":11},{"id":"porta_dimensionale_mag","nome":"Porta dimensionale (Mag)","costo":4,"requisiti":"Convocatore di 17° livello.","testo":"Una volta al giorno, l’eidolon può teletrasportarsi entro 50 m.","speciale":"","lv":17},{"id":"resistenza_agli_incantesimi","nome":"Resistenza agli incantesimi","costo":4,"requisiti":"Convocatore di 9° livello.","testo":"L'eidolon ottiene una RI pari a 10 + livello di convocatore. Questa RI non si applica agli incantesimi lanciati dal convocatore. Si può sopprimere o riattivare questa RI come azione veloce.","speciale":"","lv":9},{"id":"soffio","nome":"Soffio","costo":4,"requisiti":"Convocatore di 9° livello.","testo":"L'eidolon sceglie un tipo di energia tra acido, elettricità, freddo o fuoco. Una volta al giorno, l’eidolon può emettere un soffio in un cono di 9 m o in una linea di 18 m che infligge 1d6 danni del tipo ti energia scelto per Dado Vita posseduto. Le creature nell’area possono può superare un Tiro Salvezza su Riflessi con CD 10 + metà Dadi Vita dell’eidolon + bonus di Costituzione dell’eidolon per dimezzare i danni. Costo extra: Spendendo 1 punto evoluzione addizionale, si può emettere un soffio aggiuntivo, fino a un massimo di tre soffi al giorno.","speciale":"","lv":9,"cd":"cos","scelta":"energia","extra":{"nome":"soffio aggiuntivo (max 3/giorno)","costo":1,"max":2}},{"id":"taglia_superiore","nome":"Taglia superiore","costo":4,"requisiti":"Convocatore di 11° livello; Evoluzione Percezione cieca.","testo":"L'eidolon diventa di taglia grande, ottenendo bonus +4 Forza (taglia), -2 Destrezza, +2 Costituzione (taglia), +2 alla CA Naturale, -1 CA, -1 tiri per colpire, -2 Furtività, +2 BMC, +2DMC (taglia). Se l’eidolon è di forma bipede ottiene anche portata 3 m. Costo extra: Spendendo 6 punti evoluzione addizionali, l'eidolon diventa invece di taglia enorme, ottenendo +8 Forza (taglia), -4 Destrezza, +4 Costituzione (taglia), +5 CA Naturale, -2 CA, -2 tiri per colpire, -4 Furtività, +3 BMC, +3 DMC (taglia). Se l’eidolon è di forma bipede ottiene anche portata 4,5 m, altrimenti ottiene portata 3 m. Vista cieca L’eidolon ottiene Vista cieca entro 9 m.","speciale":"","lv":9,"taglia":true}],"doti":[{"id":"eidolon_arcanofocalizzante","nome":"Eidolon arcanofocalizzante","meta":false,"requisiti":"Convocatore di 5° livello.","testo":"Il convocatore ottiene i benefici del talento Incantesimi focalizzati (tutti), ma può beneficiarne solo quando si trova entro 4,5 m dall’eidolon."},{"id":"eidolon_guardiano","nome":"Eidolon guardiano","meta":false,"requisiti":"","testo":"Fintanto che si trova entro 4,5 m dall’eidolon, il convocatore ottiene +1 ai Tiri Salvezza."},{"id":"eidolon_meditativo","nome":"Eidolon meditativo","meta":false,"requisiti":"Convocatore di 5° livello.","testo":"Fintanto che si trova entro 4,5 m dall’eidolon, il convocatore ottiene +2 alle prove di Concentrazione."},{"id":"eidolon_persistente","nome":"Eidolon persistente","meta":false,"requisiti":"","testo":"Se il convocatore cade privo di sensi, si addormenta o muore, l’eidolon scompare dopo un numero di round pari al livello di convocatore. Se il convocatore torna cosciente prima che questi round terminino, l’eidolon non scompare."},{"id":"eidolon_vigile","nome":"Eidolon vigile","meta":false,"requisiti":"","testo":"L’eidolon ottiene la condizione sempre pronto. Se quando si determina l’Iniziativa di uno scontro l’eidolon si trova entro 4,5 m dal convocatore, anche quest’ultimo ottiene la condizione sempre pronto."},{"id":"evocazione_extra","nome":"Evocazione extra","meta":false,"requisiti":"Privilegio di classe Evoca esterno.","testo":"Si ottiene 1 utilizzo giornaliero extra di evoca esterno."},{"id":"evocazioni_arcane","nome":"Evocazioni arcane","meta":true,"requisiti":"","testo":"La creatura evocata tramite evoca esterno ottiene bonus +2 ai Tiri Salvezza contro gli incantesimi e i suoi attacchi contano come magici."},{"id":"evocazioni_caustiche","nome":"Evocazioni caustiche","meta":true,"requisiti":"","testo":"La creatura evocata tramite evoca esterno ottiene immunità all’acido. Inoltre, i suoi attacchi con le armi e con gli attacchi naturali infliggono 1 danno da acido extra per livello di evoca esterno utilizzato."},{"id":"evocazioni_coriacee","nome":"Evocazioni coriacee","meta":false,"requisiti":"Dote da convocatore Evocazioni potenziate.","testo":"Le creature evocate tramite evoca esterno ottengono bonus di potenziamento +2 alla CA Naturale già esistente."},{"id":"evocazioni_distanti","nome":"Evocazioni distanti","meta":false,"requisiti":"","testo":"Le creature evocate tramite evoca esterno possono essere collocate entro 9 m dal convocatore, anziché adiacenti ad esso."},{"id":"evocazioni_durature","nome":"Evocazioni durature","meta":false,"requisiti":"","testo":"Le creature evocate tramite evoca esterno permangono per 1 minuto per livello, anziché per 1 minuto. Inoltre, ottengono vantaggio nei Tiri Salvezza contro gli effetti che bandiscono le creature extraplanari (come gli incantesimi Congedo ed Esilio)."},{"id":"evocazioni_elettrostatiche","nome":"Evocazioni elettrostatiche","meta":true,"requisiti":"","testo":"La creatura evocata tramite evoca esterno ottiene immunità all’elettricità. Inoltre, i suoi attacchi con le armi e con gli attacchi naturali infliggono 1 danno da elettricità extra per livello di evoca esterno utilizzato."},{"id":"evocazioni_erranti","nome":"Evocazioni erranti","meta":true,"requisiti":"Convocatore di 3° livello.","testo":"La creatura evocata tramite evoca esterno ignora le penalità al movimento dovute ai terreni difficili, eccetto quelli manipolati magicamente."},{"id":"evocazioni_esplosive","nome":"Evocazioni esplosive","meta":true,"requisiti":"Convocatore di 9° livello.","testo":"La creatura evocata tramite evoca esterno permane solamente per 1 round, ma beneficia degli effetti dell’incantesimo Velocità e ottiene vantaggio nei tiri per colpire, Tiri Salvezza e prove di abilità."},{"id":"evocazioni_evanescenti","nome":"Evocazioni evanescenti","meta":true,"requisiti":"Convocatore di 7° livello.","testo":"La creatura evocata tramite evoca esterno ha il 15% di probabilità di essere mancata."},{"id":"evocazioni_lunari","nome":"Evocazioni lunari","meta":true,"requisiti":"","testo":"La creatura evocata tramite evoca esterno può vedere al buio, anche all’interno delle zone di oscurità magica. Inoltre, i suoi attacchi con le armi e con gli attacchi naturali infliggono 1 danno da freddo extra per livello di evoca esterno utilizzato."},{"id":"evocazioni_messaggere","nome":"Evocazioni messaggere","meta":false,"requisiti":"Convocatore di 3° livello.","testo":"Quando il convocatore lancia un incantesimo a contatto, può designare l’eidolon o una creatura evocata tramite evoca esterno come “colui che crea il contatto”. Per fare ciò i due devono trovarsi entro 4,5 m di distanza al momento del lancio dell’incantesimo. La creatura o l’eidolon può quindi mantenere la carica e trasmettere l'incantesimo come fosse il convocatore stesso. La carica dell’incantesimo si dissolve se il convocatore lancia un altro incantesimo."},{"id":"evocazioni_nauseabonde","nome":"Evocazioni nauseabonde","meta":true,"requisiti":"Convocatore di 5° livello.","testo":"La creatura evocata tramite evoca esterno secerne un odore intenso, come un orribile fetore, un insostenibile aroma di incenso o un profumo oltremodo dolce. Le creature viventi che iniziano il proprio turno adiacenti alla creatura devono superare un Tiro Salvezza su Tempra con CD 10 + metà Dadi Vita dell’esterno + bonus di Costituzione dell’esterno o diventare inferme per 1 minuto. Questo è un effetto di [veleno]. Se il tiro riesce, la vittima diventa immune per 24 ore all’effetto di questa dote da convocatore, indipendentemente dalla creatura che emana l’odore. Nota: Tramite questa dote si può evocare solo creature di ameno 1 livello inferiore a quello massimo evocabile."},{"id":"evocazioni_potenziate","nome":"Evocazioni potenziate","meta":false,"requisiti":"","testo":"Le creature evocate tramite evoca esterno ottengono bonus +1 ai tiri per colpire e +2 ai danni con le armi e gli attacchi naturali."},{"id":"evocazioni_rapide","nome":"Evocazioni rapide","meta":false,"requisiti":"Convocatore di 15° livello.","testo":"Il convocatore può spendere 2 usi giornalieri extra di evoca esterno per usare tale capacità come azione veloce, anziché standard."},{"id":"evocazioni_solari","nome":"Evocazioni solari","meta":true,"requisiti":"","testo":"La creatura evocata tramite evoca esterno ottiene immunità al fuoco. Inoltre, i suoi attacchi con le armi e con gli attacchi naturali infliggono 1 danno da fuoco extra per livello di evoca esterno utilizzato."},{"id":"evocazioni_stellari","nome":"Evocazioni stellari","meta":true,"requisiti":"","testo":"La creatura evocata tramite evoca esterno ottiene bonus +3 ai Tiri Salvezza contro gli effetti di [ammaliamento: charme e compulsione] e [sonno]. Inoltre, i suoi attacchi con le armi e con gli attacchi naturali sono considerati in argento e ferro freddo. Infine, le creature ferite da un’arma o un attacco naturale della creatura, subiscono per 1 round -20 Furtività e non possono beneficiare di alcuna probabilità di essere mancate."},{"id":"punti_evoluzione_extra","nome":"Punti evoluzione extra","meta":false,"requisiti":"","testo":"I punti evoluzione massimi dell’eidolon del convocatore aumentano di 1. Speciale: Questa dote può essere selezionata una volta addizionale al 5°, al 9° e al 13° livello."}],"archetipi":[{"id":"leader_empireo","nome":"Leader empireo","descr":"Un leader empireo possiede capacità uniche che gli consentono di comandare efficacemente le forze evocate. Questi peculiari convocatori non hanno un eidolon, ma godono della più totale devozione degli alleati e degli esterni che evocano.","voci":[{"nome":"Competenze offensive","testo":"Competenza nelle armi semplici, Competenza nelle armi da guerra.","diciture":[]},{"nome":"Competenze difensive","testo":"Competenza nelle armature leggere, Competenza nelle armature medie, Competenza negli scudi piccoli, Competenza negli scudi leggeri.","diciture":[]},{"nome":"Ricchezza iniziale","testo":"135 mo.","diciture":[]},{"nome":"Fallimento degli incantesimi","testo":"Al 1° livello, un leader empireo non è soggetto al fallimento degli incantesimi da convocatore con componenti somatiche, dovuto ad armature leggere, armature medie e scudi.","diciture":["Privilegio di classe modificato: Incantesimi al 1° livello."]},{"nome":"Evocatore talentuoso","testo":"Al 1° livello, un leader empireo ottiene due volte la dote da convocatore Evocazione extra. Inoltre ottiene la dote da convocatore Evocazioni potenziate, ma il bonus da essa offerto aumenta di +1 ogni quattro livelli oltre il 1°.","diciture":["Privilegio di classe sostituito: Eidolon al 1° livello."]},{"nome":"Doti da convocatore","testo":"Quando un leader empireo ottiene un talento in seguito all’avanzamento di livello, può scegliere invece di ottenere una dote da convocatore relativa all’evocazione degli esterni (quelle che iniziano con la parola “Evocazioni”).","diciture":["Privilegio di classe modificato: Dote da convocatore a ciascun livello."]},{"nome":"Cura empirea (Sop)","testo":"Al 1° livello, come azione standard che provoca attacchi di opportunità, un leader empireo può scegliere una creatura in vista entro 9 m che sia stata evocata tramite evoca esterno, e curarla di un numero di danni pari a 1d6 + 1d6 ogni due livelli oltre il 1°. Si può usare questa capacità per un numero di volte al giorno pari a 3 + bonus di Carisma.","diciture":["Privilegio di classe sostituito: Legame vitale al 1° livello."]},{"nome":"Evocazioni coriacee","testo":"Al 2° livello, un leader empireo ottiene la dote da convocatore Evocazioni coriacee.","diciture":["Privilegio di classe sostituito: Sensi dell’eidolon al 2° livello."]},{"nome":"Evocazioni combattive","testo":"Al 4° livello, all’alba di ogni giorno un leader empireo può scegliere un talento di Combattimento e lo fornisce a tutte le creature che quel giorno evocherà tramite evoca esterno. Le creature evocate non devono soddisfare i requisiti del talento, ma deve farlo il leader empireo stesso, usando come bonus di attacco base il proprio livello. Al 12° livello, tramite questa capacità un leader empireo può fornire due talenti di Combattimento, e uno può fungere da requisito per l’altro.","diciture":["Privilegio di classe sostituito: Scudo alleato al 4° livello e Scudo alleato superiore al 12° livello."]},{"nome":"Martiri gloriosi (Sop)","testo":"Al 6° livello, come azione standard un leader empireo può far detonare una creatura evocata tramite evoca esterno, facendo sì che infligga a ogni creatura adiacente un numero di danni da forza pari a 1d6 ogni due Dadi Vita posseduti. Le vittime possono superare un Tiro Salvezza su Riflessi con CD 10 + metà livello di leader empireo + bonus di Carisma per dimezzare i danni.","diciture":["Privilegio di classe sostituito: Richiamo al 6° livello e Trasposizione all’8° livello."]},{"nome":"Velocità empirea (Sop)","testo":"Al 10° livello, come azione standard un leader empireo può esortare gli alleati entro 15 m, fornendogli per 5 round gli effetti dell’incantesimo Velocità. Si può usare questa capacità una volta al giorno più una al 18° livello.","diciture":["Privilegio di classe sostituito: Trasferimento evoluzionistico al 10° livello e Trasferimento evoluzionistico superiore al 18° livello."]},{"nome":"Evocazioni vitali","testo":"Al 14° livello, le creature evocate da un leader empireo tramite evoca esterno ottengono 2 Punti Ferita extra per Dado Vita posseduto.","diciture":["Privilegio di classe sostituito: Sacrificio al 14° livello e Fusione al 16° livello."]},{"nome":"Leader supremo (Sop)","testo":"Al 20° livello, un leader empireo viene infuso con il potere dei piani, ottenendo RE 10 (elettricità e fuoco) e immunità all'acido, al freddo, agli effetti di [veleno] e [pietrificazione]. Inoltre, ottiene una velocità di Volare di 9 m (buona) ma restando a un’altezza massima di 1 m da terra. Infine, tutte le creature evocate da un leader empireo tramite evoca esterno infliggono 2d6 danni extra con i propri attacchi naturali e con le armi.","diciture":["Privilegio di classe sostituito: Potere assoluto al 20° livello."]}],"tocca":["Dote da convocatore","Eidolon","Fusione","Incantesimi","Legame vitale","Potere assoluto","Richiamo","Sacrificio","Scudo alleato","Scudo alleato superiore","Sensi dell’eidolon","Trasferimento evoluzionistico","Trasferimento evoluzionistico superiore","Trasposizione"]},{"id":"profeta","nome":"Profeta","descr":"I profeti comunicano con antichi poteri divini per guidare grandi comunità o piccoli gruppi di seguaci. Sono molti i casi nel passato infatti, in cui una riforma religiosa importante o un nuovo culto sono stati ispirati da un profeta, scambiando il suo agire per manifestazioni divine.","voci":[{"nome":"Abilità di classe","testo":"ottiene Diplomazia, Conoscenze (religioni) e Raggirare al posto di Conoscenze (natura), Sopravvivenza e Utilizzare congegni magici.","diciture":[]},{"nome":"Divinità","testo":"Un profeta deve essere devoto a una divinità (vedi Volume 3 − Divinità). Un profeta che non sia devoto ad alcuna divinità fallisce automaticamente il lancio di qualsiasi incantesimo da convocatore e non può beneficiare delle capacità straordinarie e magiche di questo archetipo.","diciture":[]},{"nome":"Incantesimi divini","testo":"Un profeta lancia i propri incantesimi come un sacerdote (dal 1° al 9° livello di magia) e deve sceglierli dalla lista del sacerdote.","diciture":["Privilegio di classe modificato: Incantesimi al 1° livello. Privilegio di classe sostituito: Evoca esterno a ciascun livello."]},{"nome":"Fallimento degli incantesimi","testo":"Al 1° livello, un profeta non è soggetto al fallimento degli incantesimi da sacerdote con componenti somatiche, dovuto ad armature leggere.","diciture":["Privilegio di classe modificato: Incantesimi al 1° livello."]},{"nome":"Consapevolezza divina (Mag)","testo":"Al 10° livello, a volontà, dopo 10 minuti di focalizzazione trascorsi adiacente all'eidolon, un profeta può lanciare l’incantesimo Chiaroudienza.","diciture":["Privilegio di classe sostituito: Trasferimento evoluzionistico al 10° livello."]},{"nome":"Attacchi divini","testo":"Al 18° livello, gli attacchi dell’eidolon di un profeta superano qualsiasi RD.","diciture":["Privilegio di classe sostituito: Trasferimento evoluzionistico superiore al 18° livello."]},{"nome":"Presenza soverchiante (Mag)","testo":"Al 20° livello, tre volte al giorno, l'eidolon di un profeta può lanciare l’incantesimo Presenza soverchiante con una CD pari a 20 + bonus di Carisma dell'eidolon.","diciture":["Privilegio di classe sostituito: Potere assoluto al 20° livello."]}],"tocca":["Evoca esterno","Incantesimi","Potere assoluto","Trasferimento evoluzionistico","Trasferimento evoluzionistico superiore"]},{"id":"elementalista","nome":"Elementalista","descr":"Gli elementalisti sono maestri nel manipolare l'energia e nell’evocare elementali dotati di grande potere. Questi convocatori possono essere trovati in tutto il mondo, sia come prime linee in battaglia, che come incursori individualisti, pronti a scatenarsi all’occorrenza.","voci":[{"nome":"Affinità a un elemento","testo":"Al 1° livello, un elementalista deve scegliere un tipo di elementale a cui legarsi tra acqua, aria, fuoco o terra. La scelta influisce su alcune capacità dell’eidolon, come mostrato dal colore. L’elementalista può cambiare il tipo di elementale a cui legarsi ogni volta che cambia le evoluzioni del proprio eidolon.","diciture":[]},{"nome":"Eidolon elementale","testo":"Al 1° livello, gli attacchi naturali dell’eidolon di un elementalista infliggono danni da freddo, elettricità, fuoco o acido. Inoltre, ottiene gratuitamente l’evoluzione Immunità (freddo, elettricità, fuoco o acido) (non deve soddisfarne i requisiti). Di contro, l’eidolon ottiene vulnerabilità al fuoco, acido, freddo o elettricità e il numero totale di punti evoluzione a sua disposizione è ridotto di 1. L’eidolon di un elementalista è un esterno elementale del tipo scelto con Affinità a un elemento, ed è soggetto agli effetti che colpiscono gli elementali.","diciture":[]},{"nome":"Evoca elementale (Mag)","testo":"Al 1° livello, un elementalista usa evoca esterno per evocare esclusivamente esterni elementali, scelti fra quelli del grado corrispondente nel Libro degli Elementali (chiedere al DM). Un elementalista non può più evocare gli esterni del Libro delle Evocazioni. Usi al giorno, progressione dei gradi e tutte le altre regole di evoca esterno restano invariati.","diciture":["Privilegio di classe modificato: Evoca esterno a ciascun livello."]},{"nome":"Natura elementale (Str)","testo":"Al 2° livello, l’eidolon di un elementalista diventa immune agli effetti di [SANGUINAMENTO], di [PARALISI], di [SONNO], di [STORDIMENTO] e di [VELENO].","diciture":["Privilegio di classe sostituito: Sensi dell’eidolon al 2° livello."]},{"nome":"Potere elementale","testo":"Al 4° livello, gli incantesimi che infliggono danni da freddo, elettricità, fuoco o acido lanciati da un elementalista entro 4,5 m dal proprio eidolon, infliggono 1 danno extra per dado lanciato. Al 12° livello, fintanto che si trova entro 4,5 m dal proprio eidolon, un elementalista può ripetere i risultati di 1 ottenuti nei dadi di danno degli incantesimi che infliggono danni da freddo, elettricità, fuoco o acido.","diciture":["Privilegio di classe sostituito: Scudo alleato al 4° livello e Scudo alleato superiore al 12° livello."]},{"nome":"Detonazione elementale","testo":"Al 6° livello, un elementalista può far detonare il proprio eidolon in una pioggia di frammenti di 4,5 m di raggio. L’esplosione esilia l’eidolon e infligge a ogni creatura nell’area 1d8 danni da freddo, elettricità, fuoco o acido per Dado Vita dell'eidolon. Se al momento della detonazione l’eidolon ha meno della metà dei suoi Punti Ferita, i dadi di danno dell’esplosione sono calcolati usando i d6, anziché i d8. Le creature colpite possono superare un Tiro Salvezza su Riflessi con CD 10 + metà livello di elementalista + bonus di Carisma per dimezzare i danni. All’8° livello, un elementalista può scegliere la detonazione del proprio eidolon avvenga sottoforma di cono di 9 m.","diciture":["Privilegio di classe sostituito: Richiamo al 6° livello e Trasposizione all’8° livello."]}],"tocca":["Evoca esterno","Richiamo","Scudo
