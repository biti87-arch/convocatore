 alleato","Scudo alleato superiore","Sensi dell’eidolon","Trasposizione"]},{"id":"creativo","nome":"Creativo","descr":"Le evocazioni e le opere di un creativo assumono una forma tangibile attraverso l’arte. Il suo eidolon è un fatato chiamato musa, che lo ispira e lo protegge.","voci":[{"nome":"Abilità di classe","testo":"ottiene anche Intrattenere.","diciture":[]},{"nome":"Punti abilità per livello","testo":"4 + bonus di Intelligenza + 2 per le abilità di background.","diciture":[]},{"nome":"Incantesimi bardici","testo":"Un creativo deve scegliere i propri incantesimi dalla lista del bardo.","diciture":[]},{"nome":"Fallimento degli incantesimi","testo":"Al 1° livello, un creativo non è soggetto al fallimento degli incantesimi da bardo Con componenti somatiche, dovuto ad armature leggere.","diciture":["Privilegio di classe modificato: Incantesimi al 1° livello."]},{"nome":"Musa ispiratrice","testo":"L’eidolon di un creativo prende il nome di Musa, la quale non è un semplice eidolon, ma un compagno fedele che aiuta ed ispira attivamente il creativo. Una musa deve sempre avere una forma base bipede. Un creativo può usare evoca esterno anche se la musa è attualmente evocata. Di contro, le creature evocate da un creativo o dalla sua musa tramite evoca esterno permangono per 3 round, anziché 1 minuto.","diciture":["Privilegio di classe modificato: Evoca esterno a ciascun livello."]},{"nome":"Focus artistico","testo":"Al 2° livello, un creativo ottiene un bonus alle prove di Concentrazione pari a metà dei suoi gradi in Intrattenere.","diciture":["Privilegio di classe sostituito: Sensi dell’eidolon al 2° livello."]},{"nome":"Dote proibita","testo":"Un creativo non può mai scegliere la dote da convocatore Evocazioni durature.","diciture":["Privilegio di classe modificato: Dote da convocatore a ciascun livello."]},{"nome":"Evocazione purificatrice","testo":"All’8° livello, dopo che la musa è stata congedata o esiliata, se non è stata evocata per almeno un’ora, quando viene evocata rimuove automaticamente una condizione che affligge il creativo.","diciture":["Privilegio di classe sostituito: Trasposizione all’8° livello."]},{"nome":"Eidolon supportante","testo":"Al 10° livello, la musa può usare evoca esterno al posto del creativo (rispettandone le regole e i limiti) e beneficiando delle doti da convocatore possedute da quest’ultimo.","diciture":["Privilegio di classe sostituito: Trasferimento evoluzionistico al 10° livello e Trasferimento evoluzionistico superiore al 18° livello."]}],"tocca":["Dote da convocatore","Evoca esterno","Incantesimi","Sensi dell’eidolon","Trasferimento evoluzionistico","Trasferimento evoluzionistico superiore","Trasposizione"]},{"id":"controevocatore","nome":"Controevocatore","descr":"Mentre la maggior parte dei convocatori eccelle nel richiamare creature nel piano materiale, alcuni si concentrano sull’ostacolare le evocazioni altrui.","voci":[{"nome":"Percepire evocazioni (Sop)","testo":"Al 1° livello, un controevocatore può rilevare la presenza (ma non la posizione) di creature evocate in un raggio di 9 m. Inoltre, percepisce automaticamente quando si trova nei pressi di luoghi destinati all’evocazione delle creature o in cui sono state fatte delle evocazioni.","diciture":[]},{"nome":"Aura di controevocazione (Sop)","testo":"Al 1° livello, un controevocatore e il suo eidolon emanano entrambi una potente aura di abiurazione di 15 m. Questa aura interferisce con gli incantesimi e le capacità nemiche atte ad evocare creature od oggetti (come gli incantesimi Armatura magica, Arma spirituale, Evoca mostri, le capacità degli esterni di evocare altre creature, etc.). Quando vengono usati all'interno dell'aura, questi incantesimi e capacità, hanno una probabilità di fallimento del 50%, che aumenta di un ulteriore 5% per ogni livello di controevocatore oltre il 10° (fino a un massimo del 90%). L’aura viene soppressa se chi la emana cade privo di sensi.","diciture":["Privilegio di classe sostituito: Evoca esterno a ciascun livello."]},{"nome":"Protezione dalle evocazioni","testo":"Al 1° livello, come azione standard un controevocatore può toccare una creatura adiacente per fornirle protezione dalle evocazioni, causando il fallimento automatico degli attacchi con armi naturali subiti di tali creature. La protezione termina dopo 1 minuto, se la creatura protetta compie un’azione ostile o tenta di toccare una qualsiasi creatura evocata o se il controevocatore usa nuovamente questa capacità. Una creatura evocata dotata di RI può ignorare questa protezione, a meno che il controevocatore non superi una prova di livello di incantatore.","diciture":[]},{"nome":"Contromagie","testo":"Come azione immediata un controevocatore può spendere uno slot da convocatore di 1° o 2° livello per lanciare l’incantesimo Dissolvi magie inferiore. Sacrificando uno slot da convocatore di 3°, 4° o 5° livello invece, può lanciare come azione immediata l’incantesimo Dissolvi magie. Sacrificando uno slot da convocatore di 6° livello infine, può lanciare come azione immediata l’incantesimo Dissolvi magie superiore.","diciture":[]},{"nome":"Indebolire evocazioni (Sop)","testo":"Al 10° livello, come azione standard un controevocatore può indebolire una creatura evocata entro 15 m. La vittima deve superare un Tiro Salvezza su Volontà con CD 10 + metà del livello di controevocatore + bonus di Carisma o diventare inferma per 1 minuto per livello, anche se normalmente è immune a tale condizione. Se il tiro riesce, la vittima è inferma per 1 round e diventa immune per 24 ore a ulteriori usi di questa capacità da parte del medesimo controevocatore. Al 15° livello, questa capacità affligge contemporaneamente tutte le creature evocate entro 15 m.","diciture":[]}],"tocca":["Evoca esterno"]},{"id":"demonologo","nome":"Demonologo","descr":"Alcuni convocatori si dedicano totalmente allo studio dei demoni, venerandoli e offrendo loro sacrifici in cambio del loro potere.","voci":[{"nome":"Allineamento","testo":"qualsiasi non buono.","diciture":[]},{"nome":"Evocazioni demoniache","testo":"Tramite evoca esterno, un demonologo può evocare solamente creature di tipo demone.","diciture":["Privilegio di classe modificato: Evoca esterno a ciascun livello."]},{"nome":"Offerta di sangue","testo":"Al 1° livello, un demonologo ottiene la dote da convocatore Evocazioni potenziate. Quando evoca una creatura tramite evoca esterno, un demonologo può infliggersi 1d6 danni per far sì che la dote da convocatore Evocazioni potenziate, anziché i consueti bonus, fornisca invece bonus +3 m alla velocità, +2 ai tiri per colpire e +2 ai danni con le armi e gli attacchi naturali.","diciture":["Privilegio di classe modificato: Evoca esterno a ciascun livello."]},{"nome":"Adorazione continua","testo":"Al 4° livello, fintanto che un demonologo si trova entro 9 m dall’eidolon, quest’ultimo ottiene bonus di circostanza +1 ai tiri per colpire, +1 alla CA e +1 ai Tiri Salvezza. Questi bonus non si applicano se il demonologo cade privo di sensi. Questi bonus diventano +2 al 12° livello.","diciture":["Privilegio di classe sostituito: Scudo alleato al 4° livello e Scudo alleato superiore al 12° livello."]},{"nome":"Teletrasporto funesto (Sop)","testo":"All'8° livello, come azione standard un demonologo può spendere 1 uso di richiamo per comandare al proprio eidolon di emergere dal corpo di una creatura vivente in vista e dotata di carne entro 9 m, infliggendole 1d6 danni per Dado Vita dell’eidolon. La vittima può superare un Tiro Salvezza su Tempra con CD 10 + metà livello di demonologo + bonus di Carisma per dimezzare i danni. L'eidolon appare in una casella adiacente alla vittima o in quella più vicina possibile.","diciture":["Privilegio di classe sostituito: Trasposizione all’8° livello."]},{"nome":"Possessione (Sop)","testo":"Al 14° livello, una volta al giorno, come azione di round completo l’eidolon può possedere e controllare il corpo di una creatura vivente dotata di carne. Questa capacità funziona come l’incantesimo Possessione della marionetta, tranne per il fatto che l’eidolon entra fisicamente nel corpo del bersaglio. La vittima può superare un Tiro Salvezza su Volontà con CD 10 + metà livello di demonologo + bonus di Carisma per negare la possessione. Se la vittima muore mentre l’eidolon la sta possedendo, quest’ultimo viene immediatamente espulso, subisce 4d6 danni ed è stordito per 1 round.","diciture":["Privilegio di classe sostituito: Sacrificio al 14° livello."]}],"tocca":["Evoca esterno","Sacrificio","Scudo alleato","Scudo alleato superiore","Trasposizione"]},{"id":"armonizzatore","nome":"Armonizzatore","descr":"Alcuni convocatori si specializzano sull’evocazione di eidolon affini al suono, sfruttandone le potenzialità per raggiungere i propri obiettivi.","voci":[{"nome":"Affinità al suono","testo":"Al 1° livello, un armonizzatore e il suo eidolon ottengono gratuitamente l’evoluzione Resistenza (suono).","diciture":["Privilegio di classe modificato: Eidolon al 1° livello."]},{"nome":"Detonazioni acustiche (Sop)","testo":"Al 1° livello, quando il suo eidolon non è evocato, come azione standard un armonizzatore può caricare l’aria attorno a sè di vibrazioni acustiche. In quel turno come azione gratuita e in seguito una volta per round come azione standard, l’armonizzatore è in grado di emettere una detonazione acustica in una casella entro 30 m da lui. Questa capacità non funziona in zone di silenzio o sott'acqua. La detonazione infligge un ammontare di danni sonori pari a 1d6 +1d6 ogni due livelli oltre il 1°. Le vittime possono superare un Tiro Salvezza su Riflessi con CD 10 + metà livello di armonizzatore + bonus di Carisma per dimezzare i danni. Le detonazioni non devono essere effettuate obbligatoriamente e l’armonizzatore può compiere altre azioni, anche lanciare incantesimi, prima di effettuarne una. Si può richiamare un numero totale di detonazioni acustiche pari al livello di armonizzatore (massimo 10). Questa capacità ha termine se l’armonizzatore evoca il proprio eidolon o dopo 1 minuto per livello. Si può usare questa capacità per un numero di volte al giorno pari a 3 + bonus di Carisma.","diciture":["Privilegio di classe sostituito: Evoca esterno a ciascun livello."]},{"nome":"Condotto acustico (Sop)","testo":"Al 4° livello, quando si trova entro 18 m dal proprio eidolon, come azione standard un armonizzatore può spendere 1 uso di detonazioni acustiche per emettere un condotto sonoro tra sé e l’eidolon. Tutte le creature attraversate dal condotto subiscono gli effetti di una detonazione acustica. All’8° livello, la CD del Tiro Salvezza di questa capacità aumenta di 2.","diciture":["Privilegio di classe sostituito: Richiamo al 6° livello e Trasposizione all’8° livello."]}],"tocca":["Eidolon","Evoca esterno","Richiamo","Trasposizione"]},{"id":"cavalca_eidolon","nome":"Cavalca eidolon","descr":"I cavalca eidolon e i loro eidolon formano squadre da combattimento perfette, completando gli uni le abilità degli altri. Essi militano all’interno degli ordini cavallereschi e sono molto apprezzati per le ovvie peculiarità delle loro “cavalcature”. Alcuni eidolon sono alleati della famiglia del convocatore da tempi immemori e la servono fedelmente di generazione in generazione, altri invece, stringono il legame con il convocatore come puro incontro casuale.","voci":[{"nome":"Abilità di classe","testo":"Cavalcare, Conoscenze (nobiltà, proibite, storia e leggende), Diplomazia, Intimidire, Intrattenere, Intuizione, Nuotare, Professione (una a scelta), Raggirare, Scalare.","diciture":[]},{"nome":"Punti abilità per livello","testo":"4 + bonus di Intelligenza + 2 per le abilità di background.","diciture":[]},{"nome":"Competenze offensive","testo":"Competenza nelle armi semplici, Competenza nelle armi da guerra.","diciture":[]},{"nome":"Competenze difensive","testo":"Competenza nelle armature leggere, Competenza nelle armature medie, Competenza nelle armature pesanti, Competenza negli scudi piccoli, Competenza negli scudi leggeri, Competenza negli scudi pesanti.","diciture":[]},{"nome":"Ricchezza iniziale","testo":"165 mo.","diciture":[]},{"nome":"Bonus Attacco pieno","testo":"Un cavalca eidolon usa la progressione di Bonus Attacco Veloce (+1 per livello di classe) al posto di quella Media del convocatore.","diciture":["Privilegio di classe modificato: Bonus Attacco a ciascun livello."]},{"nome":"Tiro Salvezza su Tempra buono","testo":"Un cavalca eidolon ha un Tiro Salvezza su Tempra buono (sale cioè come quello su Volontà).","diciture":[]},{"nome":"Eidolon atipico","testo":"L’eidolon di un cavalca eidolon deve avere una forma base aberrante, quadrupede o serpentiforme. L’eidolon di un cavalca eidolon ha sia i Punti Fatica che i Punti Ferita e beneficia della guarigione naturale.","diciture":[]},{"nome":"Cavalcatura fidata","testo":"L’eidolon di un cavalca eidolon ottiene gratuitamente l’evoluzione Cavalcatura. Inoltre, un cavalca eidolon ottiene il talento Combattere in sella (deve soddisfarne i requisiti), ma può beneficiarne solo quando è in arcione al suo eidolon.","diciture":["Privilegio di classe sostituito: Incantesimi a ciascun livello."]},{"nome":"Ordine cavalleresco","testo":"Al 1° livello, un cavalca eidolon ottiene ordine cavalleresco (vedi privilegi di classe del cavaliere).","diciture":["Privilegio di classe sostituito: Evoca esterno a ciascun livello."]},{"nome":"Cura dell’eidolon (Sop)","testo":"Al 1° livello, come azione veloce un cavalca eidolon può toccare il proprio eidolon per curarlo tramite l’energia positiva di 1d6 danni ogni due livelli. Si può usare questa capacità per un numero di volte al giorno pari a 1 + metà livello.","diciture":[]},{"nome":"Carica focalizzata","testo":"Al 3° livello, quando effettua una carica in arcione al proprio eidolon, un cavalca eidolon e l’eidolon stesso ottengono +4 ai tiri per colpire, anziché +2, e non subiscono la consueta penalità alla CA.","diciture":[]},{"nome":"Talenti di squadra bonus","testo":"Al 4°, all’8°, al 12° e al 16° livello, un cavalca eidolon ottiene un talento scelto tra quelli di Combattimento o di Squadra (deve soddisfarne i requisiti). I talenti di Squadra così ottenuti vengono appresi anche dall’eidolon del cavalca eidolon (non deve soddisfarne i requisiti).","diciture":["Privilegio di classe sostituito: Scudo alleato al 4° livello, Trasposizione all’8° livello, Scudo alleato superiore al 12° e Fusione al 16° livello."]},{"nome":"Carica ispirata","testo":"Al 6° livello, quando effettuano una carica, tutti gli alleati entro 15 m dall’eidolon di un cavalca eidolon (eidolon e cavalca eidolon compresi) ottengono +4 ai tiri per colpire, anziché +2, e non subiscono la consueta penalità di -2 alla CA.","diciture":["Privilegio di classe sostituito: Richiamo al 6° livello."]},{"nome":"Carica possente","testo":"Al 12° livello, quando effettua una carica in arcione al proprio eidolon, un cavalca eidolon raddoppia la minaccia di critico delle armi da mischia impugnate. Questo effetto non si cumula con altri che migliorano la minaccia di critico. Inoltre, sempre quando effettua una carica in arcione al proprio eidolon, quando colpisce con il primo attacco, come azione gratuita che non provoca attacchi di opportunità, può effettuare contro la vittima una manovra di Spingere o Sbilanciare.","diciture":[]},{"nome":"Carica suprema","testo":"Al 20° livello, quando effettua una carica in arcione al proprio eidolon, un cavalca eidolon infligge danni doppi (o tripli se usa una lancia da cavaliere). Se il cavalca eidolon possiede il talento Carica devastante, infligge invece danni tripli (o quadrupli se usa una lancia da cavaliere). Inoltre, sempre quando effettua una carica in arcione al proprio eidolon, se il cavalca eidolon conferma un colpo critico, la vittima deve superare un Tiro Salvezza su Volontà con CD 10 + il bonus di attacco del cavalca eidolon + bonus di Carisma o è stordita per 1d4 round. Se supera il tiro, la vittima è barcollante per 1 round.","diciture":["Privilegio di classe sostituito: Potere assoluto al 20° livello."]}],"tocca":["Bonus Attacco","Evoca esterno","Fusione","Incantesimi","Potere assoluto","Richiamo","Scudo alleato","Scudo alleato superiore","Trasposizione"]},{"id":"signore_delle_schiere","nome":"Signore delle Schiere","descr":"I signori delle schiere rinunciano al legame esclusivo con un eidolon per comandare intere legioni di esterni, che rispondono alla loro chiamata in numero sempre maggiore.","voci":[{"nome":"Esterno prediletto (Mag)","testo":"Al 1° livello, un signore delle schiere non ottiene un eidolon. In compenso, all’alba di ogni giorno sceglie come prediletto un esterno di livello pari al massimo evocabile tramite evoca esterno. L’esterno prediletto non permane per 1 minuto, ma segue le regole dell’eidolon: si evoca a volontà con un rituale di 5 minuti; scompare se il convocatore cade privo di sensi, si addormenta, muore o lo congeda con un’azione gratuita; viene esiliato se ucciso, se viene bandito da un effetto o se si allontana a più di 1 km dal convocatore, e in tal caso non può essere evocato fino all’alba del giorno seguente. Se l’esterno prediletto era scomparso, torna con i medesimi Punti Ferita di quando è scomparso; se era stato esiliato, torna con la metà dei suoi Punti Ferita massimali. Non è possibile usare evoca esterno se il proprio esterno prediletto è attualmente evocato, né evocare l’esterno prediletto se si è attualmente evocato un esterno tramite evoca esterno. Un signore delle schiere non può selezionare doti da convocatore che richiedono un eidolon.","diciture":["Privilegio di classe sostituito: Eidolon al 1° livello."]},{"nome":"Riserva di evocazioni","testo":"Al 1° livello, un signore delle schiere può usare evoca esterno un numero di volte al giorno pari a 5 + bonus di Carisma, anziché 3 + bonus di Carisma.","diciture":["Privilegio di classe sostituito: Legame vitale al 1° livello."]},{"nome":"Talento bonus","testo":"Al 2° livello, un signore delle schiere ottiene Aumentare Evocazione come talento bonus, anche se non ne soddisfa i requisiti.","diciture":["Privilegio di classe sostituito: Sensi dell’eidolon al 2° livello."]},{"nome":"Doti da convocatore","testo":"Un signore delle schiere aggiunge alla lista delle doti da convocatore selezionabili Evocazione Superiore (funziona come il talento omonimo) e Mostri Evocati Evoluti (funziona come il talento omonimo, applicato a evoca esterno; può essere selezionata più volte), anche se non ne soddisfa i requisiti.","diciture":["Privilegio di classe modificato: Dote da convocatore a ciascun livello."]},{"nome":"Evocazione multipla","testo":"Al 4° livello, quando usa evoca esterno un signore delle schiere può scegliere di evocare 1d3 esterni identici di 1 livello inferiore rispetto al massimo evocabile, anziché un singolo esterno.","diciture":["Privilegio di classe sostituito: Scudo alleato al 4° livello e Scudo alleato superiore al 12° livello."]},{"nome":"Evocazione multipla superiore","testo":"All’8° livello, quando usa evoca esterno un signore delle schiere può scegliere di evocare 1d4+1 esterni identici di 2 livelli inferiori rispetto al massimo evocabile.","diciture":["Privilegio di classe sostituito: Richiamo al 6° livello e Trasposizione all’8° livello."]},{"nome":"Vincolo prediletto (Sop)","testo":"Al 10° livello, l’esterno prediletto ottiene 2 punti evoluzione da spendere in evoluzioni disponibili a un eidolon (di cui deve soddisfare i requisiti), scelte dal convocatore. Al 18° livello questi punti evoluzione aumentano a 4.","diciture":["Privilegio di classe sostituito: Trasferimento evoluzionistico al 10° livello e Trasferimento evoluzionistico superiore al 18° livello."]},{"nome":"Sacrificio delle schiere (Sop)","testo":"Al 14° livello, ogni volta che un signore delle schiere verrebbe mandato a 0 Punti Ferita o meno, può invece assegnare al proprio esterno prediletto tutto il danno. Questo danno viene trasferito 1 punto alla volta, il che significa che non appena l’esterno prediletto è ridotto a 0 Punti Ferita, tutti i danni rimanenti dovranno essere assegnati al convocatore.","diciture":["Privilegio di classe sostituito: Sacrificio al 14° livello."]},{"nome":"Schiere congiunte","testo":"Al 16° livello, un signore delle schiere può usare evoca esterno anche mentre il proprio esterno prediletto è evocato, e viceversa; l’esterno prediletto non scompare quando vengono evocati nuovi esterni tramite evoca esterno.","diciture":["Privilegio di classe sostituito: Fusione al 16° livello."]},{"nome":"Apoteosi delle schiere (Sop)","testo":"Al 20° livello, ogni volta che usa evocazione multipla o evocazione multipla superiore, un signore delle schiere evoca sempre il numero massimo di esterni possibile. Inoltre, tutti gli esterni che evoca tramite evoca esterno ottengono 2 Punti Ferita extra per Dado Vita posseduto e Riduzione del Danno 5/—.","diciture":["Privilegio di classe sostituito: Potere assoluto al 20° livello."]}],"tocca":["Dote da convocatore","Eidolon","Fusione","Legame vitale","Potere assoluto","Richiamo","Sacrificio","Scudo alleato","Scudo alleato superiore","Sensi dell’eidolon","Trasferimento evoluzionistico","Trasferimento evoluzionistico superiore","Trasposizione"]}]};

 22)"],"speciali":["Incendiare (Str): chi è colpito tira Riflessi CD 22 o prende fuoco, subendo 5d6 [FUOCO] all'inizio di ogni suo turno. Si spegne con un'azione di round completo e un nuovo Tiro Salvezza. Una volta per round.","Luce Viva (Str): emana luce come un incendio e non può essere Invisibile.","Aura di Calore (Sop): chi termina il proprio turno entro 4,5 m dalla Conflagrazione subisce 5d6 [FUOCO], senza Tiro Salvezza.","Tempesta di Fuoco (Sop): ogni quadretto che attraversa prende fuoco per 1 round. Chi vi entra o vi termina il turno subisce 5d6 [FUOCO], Riflessi CD 22 dimezza.","Rogo Vivente (Sop) — capacità firma: una volta ogni 1d4 round, azione standard, esplosione radiale di 9 m: 10d6 [FUOCO], Riflessi CD 22 dimezza. Chi fallisce è Abbagliato per 1d6 round e prende fuoco come da Incendiare, senza ulteriore Tiro Salvezza."],"altro":["Spazio: 4,5 m     Portata: 4,5 m"],"pf":168,"dv":16,"taglia":"Enorme","tipo":"elementale del fuoco","ca":26,"ts":{"Tempra":15,"Riflessi":19,"Volontà":13}},{"gruppo":"Primordiali","id":"montagna_errante","nome":"Montagna Errante","libro":"elementali","grado":8,"descr":"Una vetta che ha lasciato la propria catena e adesso attraversa la pianura, un passo al minuto, senza deviare per nulla.","campi":{"Tipo di esterno":"elementale della terra","Sensi":"Scurovisione 18 m, Percezione tellurica 18 m","Statistiche":"Taglia enorme; Velocità 12 m, Scavare 12 m","Caratteristiche":"Forza 40, Destrezza 8, Costituzione 22, Intelligenza 18, Saggezza 16, Carisma 16","Abilità":"Furtività +9 (+17 nella pietra), Percezione +22, Scalare +37","Talenti":"Arma Focalizzata (schianto), Attacco Poderoso, Grande Fortezza, Incalzare, Riflessi Fulminei, Schivare, Stoccata, Volontà di Ferro","CA":"24, contatto 8, impreparato 24 (−2 taglia, −1 Des, +16 naturale, +1 schivare)","PF":"196 (16 DV)","Tiri Salvezza":"Tempra +19, Riflessi +9, Volontà +16","RD":"15/—","Attacchi":"3 schianti di pietra +31 (4d6+15)","BMC":"+33","DMC":"44"},"magiche":[],"speciali":["Scorrere nella Terra (Str): attraversa terra e pietra naturale senza lasciare varchi. È immune a Immobilizzato causato dal terreno.","Frantumare (Str): lo schianto ignora la Durezza di pietra, terra e mattone. Contro una creatura, tentativo gratuito di Spezzare su un'arma o uno scudo impugnato, senza provocare attacchi di opportunità. Una volta per round.","Radicarsi (Str): con un'azione di movimento si àncora al suolo. Finché non si muove, chi tenta di Spingerla, Sbilanciarla o Trascinarla ha Svantaggio alla prova di manovra in combattimento.","Scossa Tellurica (Sop): 3 per evocazione, azione standard, emanazione di 9 m centrata su di sé, solo restando a contatto col terreno. 6d6 danni, Riflessi CD 23 dimezza ed evita di cadere Prono. L'area resta terreno difficile per 3 round. Chi non tocca il suolo non è influenzato.","Peso della Montagna (Str): quando carica, il primo schianto che va a segno infligge danno doppio e il bersaglio tira Tempra CD 23 o è Stordito per 1 round.","Frana (Sop) — capacità firma: una volta ogni 1d4 round, azione di round completo, linea di 24 m: 10d6, Riflessi CD 23 dimezza. Chi fallisce cade Prono e resta sepolto, Immobilizzato: si libera con un'azione di round completo e una prova di Forza o Artista della Fuga alla stessa CD, e finché resta sepolto subisce 3d6 all'inizio di ogni suo turno."],"altro":["Spazio: 4,5 m     Portata: 4,5 m"],"pf":196,"dv":16,"taglia":"Enorme","tipo":"elementale della terra","ca":24,"ts":{"Tempra":19,"Riflessi":9,"Volontà":16}},{"gruppo":"Secondari","id":"abisso_fangoso","nome":"Abisso Fangoso","libro":"elementali","grado":8,"descr":"Una palude che si è alzata tutta insieme, e sotto la superficie si vedono le cose che ha inghiottito negli anni, ancora intatte.","campi":{"Tipo di esterno":"elementale del fango, acquatico","Sensi":"Scurovisione 18 m, Percezione tellurica 18 m","Statistiche":"Taglia enorme; Velocità 15 m, Nuotare 15 m, Scavare 15 m","Caratteristiche":"Forza 36, Destrezza 8, Costituzione 22, Intelligenza 18, Saggezza 16, Carisma 22","Abilità":"Furtività +9 (+17 in terreno paludoso), Nuotare +38, Percezione +22","Talenti":"Arma Focalizzata (schianto), Attacco Poderoso, Grande Fortezza, Incalzare, Schivare, Stoccata, Volontà di Ferro, Riflessi Fulminei","CA":"23, contatto 8, impreparato 23 (−2 taglia, −1 Des, +15 naturale, +1 schivare)","PF":"196 (16 DV)","Tiri Salvezza":"Tempra +19, Riflessi +9, Volontà +16","RD":"15/—","Attacchi":"3 schianti di limo +28 (3d6+13)","BMC":"+31","DMC":"43"},"magiche":["LI 16°; Concentrazione +22","3 per evocazione – Intralciare* (CD 23)","* Intralciare dell'Abisso Fangoso non evoca vegetazione: il terreno nell'area si scioglie in fango profondo e risucchiante. Meccanica identica all'incantesimo, ma non richiede piante preesistenti e funziona su qualunque superficie di terra, sabbia o roccia porosa; non funziona su pietra viva, metallo o pavimentazione lavorata. Chi è Intralciato lo è per il risucchio del fango, non per viticci: liberarsi richiede una prova di Forza o Artista della Fuga, mai Sopravvivenza o danni all'area."],"speciali":["Scorrere nel Fango (Str): attraversa fango, melma e terreno paludoso senza rallentare. È immune a Intralciato causato dal terreno.","Intrappolare (Str): chi è colpito tira Tempra CD 23 o è Intralciato per 1d6 round. Si libera prima con un'azione di round completo e una prova di Forza o Artista della Fuga alla stessa CD. Una volta per round.","Pantano (Sop): 3 per evocazione, azione standard, il terreno entro 9 m si trasforma in fango profondo per 3 round. Chi vi si muove avanza a metà velocità e subisce 6d6 danni da soffocamento se vi termina il turno, Tempra CD 23 dimezza. L'Abisso si muove nell'area senza penalità.","Inghiottire (Str): una creatura Immobilizzata dalle sue capacità e di taglia inferiore alla sua può essere assorbita nel proprio corpo con un'azione standard. All'interno subisce 4d6 all'inizio di ogni suo turno e non può respirare. Si libera infliggendogli 30 danni dall'interno op function calcEid(){
  const L=lv();const row=C.tabella[L-1];const f=C.forme[S.forma];
  const base=baseEvo();const scelte=S.evo.filter(e=>EVO[e.id]);
  const ev=[...base,...scelte];
  const taglia=tagliaEid(ev);const T=TAGLIA[taglia];
  const err=[];
  // punti
  let pe=row.pe+nDote('punti_evoluzione_extra')+(L>=20&&S.rituale==='eidolon'?4:0);
  const trasf=Math.min(+S.trasf||0,trasfMax());
  pe-=trasfRid(trasf);
  if(has('elementalista'))pe-=1;
  let spesi=0;
  const stato=scelte.map(e=>{
    const d=EVO[e.id];const probs=[];
    if(d.lv&&L<d.lv)probs.push('richiede convocatore di '+d.lv+'° livello');
    if(d.id==='taglia_superiore'){if(S.taglia==='Piccola')probs.push('richiede taglia media');if(e.extra&&L<13)probs.push('taglia enorme dal 13° livello');}
    if(d.forme&&!d.forme.includes(S.forma))probs.push('forma base non ammessa');
    for(const r of d.req||[])if(!ev.some(x=>x.id===r))probs.push('richiede '+EVO[r].nome);
    if(d.reqUno&&!d.reqUno.some(r=>ev.some(x=>x.id===r)))probs.push('richiede '+d.reqUno.map(r=>EVO[r].nome).join(' o '));
    if(d.reqAtt&&!attacchiEvo(ev).length)probs.push('richiede un attacco naturale');
    if(d.reqImm&&!ev.some(x=>x.id==='immunita_sop'&&x.scelta&&x.scelta===e.scelta))probs.push('richiede Immunità (Sop) '+(e.scelta?'al '+e.scelta:'alla stessa energia'));
    const c=costoEvo(e,taglia);spesi+=c;
    return {e,d,c,probs};
  });
  // limiti di selezione
  const cont={};for(const e of ev)cont[e.id]=(cont[e.id]||0)+1;
  for(const id in cont){const d=EVO[id];const mx=maxSel(d,L);if(cont[id]>mx)err.push(d.nome+': selezionabile al massimo '+mx+(mx===1?' volta':' volte')+' a questo livello');}
  const braccia=cont.arti_braccia||0,usiB=(cont.artigli||0)+(cont.schianto||0)+(cont.chele||0);
  if(usiB>braccia)err.push('Artigli, Schianto e Chele richiedono un paio di Arti [braccia] ciascuno ('+usiB+' su '+braccia+')');
  const code=cont.coda||0,usiC=(cont.colpo_di_coda||0)+(cont.pungiglione||0);
  if(usiC>code)err.push('Colpo di coda e Pungiglione richiedono una Coda ciascuno ('+usiC+' su '+code+')');
  if(f.corpoInforme&&(cont.artigli||cont.schianto||cont.chele)&&!braccia)err.push('Un eidolon amorfo deve prima acquistare Arti [braccia]');
  if(S.taglia==='Media'&&f.mediaCosta){spesi+=f.mediaCosta;}
  // caratteristiche
  const car={For:+S.fis.For,Des:+S.fis.Des,Cos:+S.fis.Cos,Int:10,Sag:10,Car:10};
  car.For+=row.forDes;car.Des+=row.forDes;
  const nAum=[5,10,15,20].filter(x=>x<=L).length;
  for(let i=0;i<nAum;i++){const k=S.aumenti[i]||'For';car[k]+=1;}
  for(const e of ev)if(e.id==='aumento_di_caratteristica')car[e.scelta||'For']+=2;
  car.For+=T.For;car.Des+=T.Des;car.Cos+=T.Cos;
  const M=Object.fromEntries(CAR.map(k=>[k,mod(car[k])]));
  // difese
  let natEvo=0;for(const e of ev)if(EVO[e.id]?.eff?.caNat)natEvo+=EVO[e.id].eff.caNat;
  let nat=row.arm+natEvo+T.nat;let defl=0;
  if(cont.barriera_arcana){defl=Math.floor(nat/2);nat-=defl;}
  const ca=10+M.Des+nat+defl+T.ca, contatto=10+M.Des+defl+T.ca, impreparato=10+nat+defl+T.ca+Math.min(0,M.Des);
  const dv=row.dv;
  let pf=10+6*(dv-1)+M.Cos*dv;
  if(S.pfManuali!==''&&S.pfManuali!=null&&!isNaN(+S.pfManuali))pf=+S.pfManuali;
  const tsB=f.tsBuoni;const tsm=(cont.tiri_salvezza_migliorati||0);
  const ts={t:(tsB.includes('t')?row.tsB:row.tsS)+M.Cos+tsm,r:(tsB.includes('r')?row.tsB:row.tsS)+M.Des+tsm,v:(tsB.includes('v')?row.tsB:row.tsS)+M.Sag+tsm};
  const ba=row.ba;
  const bmc=ba+M.For+T.bmc, dmc=10+ba+M.For+M.Des+T.bmc;
  // attacchi
  const atks=attacchiEvo(ev);
  const nTot=atks.reduce((s,a)=>s+a.n,0);
  const multi=L>=9;
  const energ=ev.filter(e=>e.id==='attacchi_energetici_sop').map(e=>e.scelta||'energia');
  const dnm=ev.filter(e=>e.id==='danno_naturale_migliorato').map(e=>e.scelta);
  const portata=ev.filter(e=>e.id==='portata').map(e=>e.scelta);
  const sang=ev.filter(e=>e.id==='sanguinamento').map(e=>e.scelta);
  const aff=ev.filter(e=>e.id==='afferrare').map(e=>e.scelta);
  const soloUno=nTot===1;
  const righe=atks.map(a=>{
    const prim=a.tipo==='p'||(soloUno);
    let txc=ba+M.For+T.txc+(prim?0:(multi&&nTot>=3?-2:-5));
    let fm=prim?(a.forza||(soloUno?1.5:1)):0.5;
    let dado=stepDado(a.dado,T.dado+(dnm.filter(x=>x===a.nome).length));
    const dmgB=Math.floor(M.For*fm);
    const extra=[];
    if(has('elementalista'))extra.push('danni da '+EN_EL[S.affinita]);
    energ.forEach(x=>extra.push('+1d6 '+x));
    if(sang.includes(a.nome))extra.push('[sanguinamento 1d6]');
    if(aff.includes(a.nome))extra.push('più Afferrare');
    if(portata.includes(a.nome))extra.push('portata +1,5 m');
    if(L>=18&&has('profeta'))extra.push('supera qualsiasi RD');
    return {nome:a.n>1?a.n+' '+({Artiglio:'Artigli',Chela:'Chele'}[a.nome]||a.nome):a.nome,plur:a.n>1,txc,dado,dmgB,prim,extra};
  });
  if(multi&&nTot>0&&nTot<3){const p=righe.find(r=>r.prim);if(p)righe.push(Object.assign({},p,{nome:(p.plur?({Artigli:'Artiglio',Chele:'Chela'}[p.nome.replace(/^\d+ /,'')]||p.nome.replace(/^\d+ /,'')):p.nome)+' (Multiattacco)',txc:p.txc-5,plur:false}));}
  if(nTot>row.att)err.push('Attacchi naturali: '+nTot+' su un massimo di '+row.att+' a questo livello');
  // movimento e sensi
  const gambeExtra=Math.max(0,(cont.arti_gambe||0)-base.filter(b=>b.id==='arti_gambe').length);
  const vel=f.vel+3*gambeExtra;
  const mov=['Velocità '+vel+' m'];
  const nuoto=(cont.anfibio?vel:0)+6*(cont.apparato_natatorio||0);
  if(nuoto)mov.push('Nuotare '+nuoto+' m');
  if(cont.scalare)mov.push('Scalare '+Math.floor(vel/2*10)/10+' m');
  if(cont.scavare)mov.push('Scavare '+Math.floor(vel/2*10)/10+' m');
  if(cont.levitazione)mov.push('Volare 9 m (buona)'+(L<17?', altezza massima 1 m':''));
  const sensi=['Scurovisione 18 m'];for(const e of ev){const d=EVO[e.id];if(d?.sensi&&!sensi.includes(d.sensi))sensi.push(d.sensi);}
  if(cont.vista_cieca)sensi.push('Vista cieca 9 m');
  // difese speciali
  const dif=[];
  const rd=Math.floor(L/2);if(rd)dif.push('RD '+rd+'/–');
  const re=5+5*[6,9,12,15,18].filter(x=>x<=L).length;
  ev.filter(e=>e.id==='resistenza').forEach(e=>dif.push('RE '+re+' ('+(e.scelta||'?')+')'));
  if(has('armonizzatore'))dif.push('RE '+re+' (suono)');
  const imm=[...ev.filter(e=>e.id==='immunita_sop').map(e=>e.scelta||'?')];
  if(imm.length)dif.push('Immunità: '+[...new Set(imm)].join(', '));
  ev.filter(e=>e.id==='assorbimento_energetico_sop').forEach(e=>dif.push('Assorbimento energetico ('+(e.scelta||'?')+'): recupera PF pari a metà dei danni, fino ai massimali'));
  if(has('elementalista')){dif.push('Vulnerabilità: '+VU_EL[S.affinita]);if(L>=2)dif.push('Immune agli effetti di [SANGUINAMENTO], [PARALISI], [SONNO], [STORDIMENTO] e [VELENO]');}
  if(cont.amorfo)dif.push('Immune a colpi critici e danni da precisione');
  else if(cont.fortificazione)dif.push('Fortificazione '+(cont.fortificazione>1?50:25)+'%');
  if(cont.resistenza_agli_incantesimi)dif.push('RI '+(10+L));
  if(L>=3)dif.push(L>=13?'Eludere migliorato':'Eludere');
  if(L>=7)dif.push('Devozione: +4 ai TS contro [AMMALIAMENTO: CHARME E COMPULSIONE]');
  ev.filter(e=>e.id==='bonus_ai_tiri_salvezza').forEach(e=>dif.push('+3 ai TS contro '+(e.scelta||'…')));
  // CD
  const cd=k=>10+Math.floor(dv/2)+M[k];
  const capac=[];
  for(const e of ev){const d=EVO[e.id];if(!d)continue;
    if(d.id==='soffio'){const n=1+Math.min(2,+(e.extra||0));capac.push('Soffio ('+(e.scelta||'energia')+'): '+dv+'d6, cono 9 m o linea 18 m, Riflessi CD '+cd('Cos')+' dimezza, '+n+'/giorno');}
    else if(d.id==='veleno')capac.push('Veleno ('+(e.scelta||'attacco')+'): Tempra CD '+(cd('Cos')+(e.extra?2:0))+' o rallentato per 3 round');
    else if(d.cd)capac.push(d.nome+': CD '+cd(d.cd==='car'?'Car':d.cd==='cos'?'Cos':'For'));
  }
  if(cont.travolgere)capac.push('Travolgere: 1d6'+sg(Math.floor(M.For*1.5))+' danni');
  // punti fatica (Cavalca eidolon)
  const fat=has('cavalca_eidolon')?{fatica:Math.ceil(pf/2),ferita:Math.floor(pf/2)}:null;
  return {L,row,f,taglia,T,ev,base,stato,cont,err,pe,spesi,trasf,car,M,nat,defl,ca,contatto,impreparato,dv,pf,fat,ts,ba,bmc,dmc,righe,nTot,mov,sensi,dif,capac,cd,nuoto};
}

/* ---------- evocazioni ---------- */
function potenziateBonus(){
  let t=0,d=0;const L=lv();
  if(nDote('evocazioni_potenziate')||has('leader_empireo')||has('demonologo')){
    if(has('demonologo')&&S.offerta){t+=2;d+=2;}
    else{t+=1;d+=2;if(has('leader_empireo')){const x=Math.floor((L-1)/4);t+=x;d+=x;}}
  }
  return {t,d};
}
function modificatori(cr,grado){
  const L=lv();const m={txc:0,dmg:0,pfDv:0,ca:0,tempra:0,bmc:0,vel:0,note:[],extraDmg:[]};
  const pb=potenziateBonus();m.txc+=pb.t;m.dmg+=pb.d;
  if(pb.t||pb.d)m.note.push(has('demonologo')&&S.offerta?'Offerta di sangue: +3 m velocità, +2 per colpire, +2 danni (il demonologo subisce 1d6 danni)':'Evocazioni potenziate: '+sg(pb.t)+' per colpire, '+sg(pb.d)+' danni');
  if(has('demonologo')&&S.offerta)m.vel+=3;
  if(nDote('evocazioni_coriacee')||(has('leader_empireo')&&L>=2)){m.ca+=2;m.note.push('Evocazioni coriacee: +2 CA naturale');}
  if(has('signore_delle_schiere')&&L>=2){m.txc+=2;m.dmg+=2;m.pfDv+=2;m.tempra+=2;m.bmc+=2;m.note.push('Aumentare Evocazione: +4 For e +4 Cos (applicati: +2 per colpire e danni, +2 PF per DV, +2 Tempra, +2 BMC/DMC)');}
  if(has('leader_empireo')&&L>=14){m.pfDv+=2;m.note.push('Evocazioni vitali: +2 PF per DV');}
  if(has('signore_delle_schiere')&&L>=20){m.pfDv+=2;m.note.push('Apoteosi delle schiere: +2 PF per DV e RD 5/—');}
  if(has('leader_empireo')&&L>=20){m.extraDmg.push('+2d6');m.note.push('Leader supremo: +2d6 danni');}
  const meta=S.meta&&nDote(S.meta)?DOTI[S.meta]:null;
  if(meta){
    const en={evocazioni_caustiche:'acido',evocazioni_elettrostatiche:'elettricità',evocazioni_lunari:'freddo',evocazioni_solari:'fuoco'}[meta.id];
    if(en){m.extraDmg.push('+'+grado+' '+en);}
    m.note.push(meta.nome+': '+meta.testo);
  }
  return m;
}
function ritocca(att,m){
  // somma i bonus ai tiri per colpire (+5 o +10/+5) e ai danni (1d6+3) nella stringa degli attacchi
  if(!m.txc&&!m.dmg&&!m.extraDmg.length)return rich(att);
  const out=att.replace(/([+−-]\d+(?:\/[+−-]\d+)*)(\s*\()(\d+d\d+)([+−-]\d+)?/g,(all,hit,par,dado,db)=>{
    const h=hit.split('/').map(x=>sg(parseInt(x.replace('−','-'))+m.txc)).join('/');
    const b=(db?parseInt(db.replace('−','-')):0)+m.dmg;
    return h+par+dado+(b?sg(b):'')+(m.extraDmg.length?' '+m.extraDmg.join(' '):'');
  });
  return '<span class="mod">'+rich(out)+'</span>';
}
function schedaCreatura(cr,grado,conMod){
  const m=conMod?modificatori(cr,grado):{txc:0,dmg:0,pfDv:0,ca:0,tempra:0,bmc:0,vel:0,note:[],extraDmg:[]};
  const c=cr.campi;const pf=cr.pf+m.pfDv*cr.dv;
  const durata=durataEvoc();
  let h='<div class="sheet"><div class="sheetHead"><div><h2>'+esc(cr.nome)+'</h2><div class="note">'+esc(cr.tipo)+' · grado '+ROM[cr.grado]+(cr.gruppo?' · '+esc(cr.gruppo):'')+'</div></div><span class="tag cb">'+esc(cr.taglia)+'</span></div>';
  h+='<div class="txt"><em>'+esc(cr.descr)+'</em></div>';
  h+='<div class="kv"><div><small>PF</small><b>'+pf+'</b><small>'+cr.dv+' DV'+(m.pfDv?' · base '+cr.pf:'')+'</small></div><div><small>CA</small><b>'+(cr.ca+m.ca)+'</b></div>'+
     '<div><small>Tempra</small><b>'+sg(cr.ts.Tempra+m.tempra)+'</b></div><div><small>Riflessi</small><b>'+sg(cr.ts.Riflessi)+'</b></div><div><small>Volontà</small><b>'+sg(cr.ts['Volontà'])+'</b></div>'+
     '<div><small>Durata</small><b>'+durata+'</b></div></div>';
  h+='<div class="atk"><div class="l"><span>Attacchi</span><span>'+ritocca(c.Attacchi||'',m)+'</span></div>';
  for(const k of ['Statistiche','Sensi','Caratteristiche','Abilità','Talenti','CA','Immunità','Resistenze','RD','RI','Debolezze']){
    if(!c[k])continue;let v=k==='CA'?esc(c[k]):rich(c[k]);
    if(k==='CA'&&m.ca)v+=' <span class="mod">(+'+m.ca+' coriacee)</span>';
    if(k==='Statistiche'){v=v.replace(/Volare ([\d,]+) m \(([^)]+)\)(?! a un)/g,(a)=>a+(lv()<17?' <span class="note">(altezza max 1 m)</span>':''));if(m.vel)v+=' <span class="mod">(+'+m.vel+' m)</span>';}
    h+='<div class="l"><span>'+k+'</span><span>'+v+'</span></div>';
  }
  h+='<div class="l"><span>BMC / DMC</span><span>'+rich(c.BMC)+(m.bmc?' <span class="mod">'+sg(m.bmc)+'</span>':'')+' / '+rich(c.DMC)+(m.bmc?' <span class="mod">'+sg(m.bmc)+'</span>':'')+'</span></div></div>';
  if(cr.magiche.length)h+='<div><div class="label">Capacità magiche</div><div class="txt">'+cr.magiche.map(x=>'<p>'+rich(x)+'</p>').join('')+'</div></div>';
  if(cr.speciali.length)h+='<div><div class="label">Capacità e attacchi speciali</div><div class="txt">'+cr.speciali.map(x=>'<p>'+rich(x)+'</p>').join('')+'</div></div>';
  if(m.note.length)h+='<div class="banner">'+m.note.map(esc).join('<br>')+'</div>';
  return h+'</div>';
}
function durataEvoc(){
  const L=lv();
  if(S.meta==='evocazioni_esplosive'&&nDote('evocazioni_esplosive'))return '1 round';
  if(has('creativo'))return '3 round';
  if(nDote('evocazioni_durature'))return L+' min';
  return '1 min';
}
function roundsEvoc(){const d=durataEvoc();const n=parseInt(d);return d.includes('round')?n:n*10;}

/* ---------- render ---------- */
const main=document.getElementById('main');
function header(){
  const sel=document.getElementById('pgSel');
  sel.innerHTML=Object.entries(G.dati).map(([k,v])=>'<option value="'+k+'"'+(k===G.attivo?' selected':'')+'>'+esc(v.nome||'Senza nome')+'</option>').join('')+'<option value="__nuovo">+ Nuovo personaggio</option>';
  const arch=S.archetipi.map(a=>ARCH[a].nome).join(', ')||'nessun archetipo';
  document.getElementById('hdrSub').textContent='Convocatore di '+lv()+'° livello · '+arch+(S.esempio?' · dati di esempio':'');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  document.getElementById('tab-eidolon').textContent=has('signore_delle_schiere')?'Prediletto':'Eidolon';
}
function render(){header();({profilo:rProfilo,eidolon:rEidolon,evoca:rEvoca})[S.tab]();save();}
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;render();window.scrollTo(0,0);});
document.getElementById('pgSel').addEventListener('change',e=>{
  if(e.target.value==='__nuovo'){const id='p'+Date.now();G.dati[id]=nuovoPg();G.attivo=id;}else G.attivo=e.target.value;
  S=fill(G.dati[G.attivo]);render();
});

/* --- tab Convocatore --- */
function rProfilo(){
  const L=lv();
  let h='<section class="panel">';
  if(S.esempio)h+='<div class="banner">Questo è un personaggio di esempio per vedere come funziona l\'app. Modificalo liberamente o creane uno nuovo dal menu in alto.</div>';
  h+='<div class="card"><h2>Convocatore</h2><div class="grid">'+
    '<div class="field" style="grid-column:1/-1"><label class="label" for="f-nome">Nome</label><input id="f-nome" value="'+esc(S.nome)+'"></div>'+
    '<div class="field"><label class="label" for="f-liv">Livello</label><input id="f-liv" type="number" min="1" max="20" value="'+L+'"></div>'+
    '<div class="field"><label class="label" for="f-car">Carisma</label><input id="f-car" type="number" min="1" max="40" value="'+S.car+'"></div>'+
    '</div><div class="row" style="margin-top:10px"><button class="btn sm" id="dup">Duplica</button><button class="btn sm danger" id="del">Elimina</button></div></div>';
  // archetipi
  h+='<div class="card"><h2>Archetipi</h2><div class="note" style="margin-bottom:8px">Due archetipi che modificano o sostituiscono lo stesso privilegio non si possono combinare.</div><div class="list">';
  for(const a of C.archetipi){
    const on=has(a.id);const cf=on?[]:conflitti(a.id);
    h+='<label class="check"><input type="checkbox" data-arch="'+a.id+'"'+(on?' checked':'')+(cf.length?' disabled':'')+'><span><b>'+esc(a.nome)+'</b>'+(cf.length?' <span class="note">— incompatibile con '+cf.map(x=>ARCH[x].nome).join(', ')+'</span>':'')+'<br><span class="note">'+esc(a.descr)+'</span></span></label>';
  }
  h+='</div></div>';
  // pannelli di archetipo
  h+=pannelliArchetipo();
  // doti
  const nDoti=1+Math.floor((L-1)/2);
  const tot=Object.values(S.doti).reduce((s,x)=>s+x,0);
  h+='<div class="card"><h2>Doti da convocatore</h2><div class="note" style="margin-bottom:8px">Scelte: '+tot+' · dal privilegio: '+nDoti+' (più quelle prese al posto dei talenti).</div><div class="list">';
  for(const d of C.doti){
    const n=nDote(d.id);const lvr=+(d.requisiti.match(/(\d+)° livello/)||[0,0])[1];
    let blocco='';
    if(lvr>L)blocco='dal '+lvr+'° livello';
    if(d.id==='evocazioni_coriacee'&&!nDote('evocazioni_potenziate'))blocco='richiede Evocazioni potenziate';
    if(d.id==='evocazioni_durature'&&has('creativo'))blocco='vietata al creativo';
    if(!haEidolon()&&/^eidolon_/.test(d.id))blocco='richiede un eidolon';
    const multi=d.id==='punti_evoluzione_extra'?1+[5,9,13].filter(x=>x<=L).length:1;
    h+='<div class="evoRow'+(blocco&&n?' bad':'')+'"><div><b>'+esc(d.nome)+'</b>'+(d.meta?' <span class="tag">metaevocazione</span>':'')+(blocco?' <span class="note warnT">'+blocco+'</span>':'')+'<div class="note">'+rich(d.testo)+'</div></div>'+
       '<div class="row">'+(multi>1?'<button class="btn sm" data-dote="'+d.id+'" data-d="-1"'+(n?'':' disabled')+'>−</button><b style="font-family:var(--f-mono)">'+n+'</b><button class="btn sm" data-dote="'+d.id+'" data-d="1"'+(n>=multi||blocco?' disabled':'')+'>+</button>':
       '<input type="checkbox" class="dchk" data-dote="'+d.id+'" aria-label="'+esc(d.nome)+'"'+(n?' checked':'')+(blocco&&!n?' disabled':'')+' style="width:20px;height:20px;accent-color:var(--accent)">')+'</div></div>';
  }
  h+='</div></div>';
  // trasferimento / rituale
  if(haEidolon()){

function abilitaEid(E){
  const A=S.eidAb||(S.eidAb={gradi:{},scelte:[]});
  const tot=Math.max(E.dv,(4+E.M.Int)*E.dv);
  const spesi=Object.values(A.gradi).reduce((x,y)=>x+(+y||0),0);
  const bonus={};const add=(k,v,why)=>{(bonus[k]=bonus[k]||[]).push([v,why]);};
  E.ev.filter(e=>e.id==='addestrato'&&e.scelta).forEach(e=>add(e.scelta,5,'Addestrato'));
  const code=E.cont.coda||0;if(code)add('Acrobazia',4+2*(code-1),'Coda (equilibrio)');
  if(E.cont.viscido)add('Artista della fuga',4,'Viscido');
  if(E.T.furt)add('Furtività',E.T.furt,'taglia');
  if(E.cont.scalare)add('Scalare',8,'velocità di Scalare');
  if(E.nuoto)add('Nuotare',8,'velocità di Nuotare');
  if(E.cont.levitazione)add('Volare',8,'velocità di Volare');
  const righe=ABILITA.map(([n,c])=>{
    const g=+A.gradi[n]||0;const cl=AB_FISSE.includes(n)||A.scelte.includes(n);
    const b=(bonus[n]||[]);const bt=b.reduce((x,y)=>x+y[0],0);
    return {n,c,g,cl,tot:E.M[c]+g+(cl&&g>0?3:0)+bt,b};
  });
  return {A,tot,spesi,righe};
}

    '<div><small>CA</small><b>'+E.ca+'</b><small>contatto '+E.contatto+' · impr. '+E.impreparato+'</small></div>'+
    '<div><small>Tempra</small><b>'+sg(E.ts.t)+'</b></div><div><small>Riflessi</small><b>'+sg(E.ts.r)+'</b></div><div><small>Volontà</small><b>'+sg(E.ts.v)+'</b></div>'+
    '<div><small>BA</small><b>'+sg(E.ba)+'</b></div><div><small>BMC</small><b>'+sg(E.bmc)+'</b></div><div><small>DMC</small><b>'+E.dmc+'</b></div></div>';
  h+='<div class="row"><div class="hp"><label class="label" for="f-epf">PF attuali</label><input id="f-epf" type="number" value="'+pfA+'"></div><div class="hp"><label class="label" for="f-pfm">PF tirati</label><input id="f-pfm" type="number" placeholder="auto" value="'+esc(S.pfManuali??'')+'"></div></div>';
  h+='<div class="bar"><i class="'+(pfA<E.pf/2?'low':'')+'" style="width:'+Math.max(0,Math.min(100,pfA/E.pf*100))+'%"></i></div>';
  h+='<div class="kv">'+CAR.map(k=>'<div><small>'+CAR_N[k]+'</small><b>'+E.car[k]+'</b><small>'+sg(E.M[k])+'</small></div>').join('')+'</div>';
  h+='<div class="atk">';
  if(!E.righe.length)h+='<div class="l"><span>Attacchi</span><span class="note">nessun attacco naturale</span></div>';
  for(const r of E.righe)h+='<div class="l"><span>'+esc(r.nome)+' <span class="note">'+(r.prim?'primario':'secondario')+'</span></span><span>'+sg(r.txc)+' ('+r.dado+(r.dmgB?sg(r.dmgB):'')+(r.extra.length?', '+rich(r.extra.join(', ')):'')+')</span></div>';
  if(E.cont.competenza_nelle_armi_semplici)h+='<div class="l"><span>Con armi</span><span>'+E.row.baArmi+' + For '+sg(E.M.For)+'</span></div>';
  h+='<div class="l"><span>Movimento</span><span>'+E.mov.join(', ')+'</span></div><div class="l"><span>Sensi</span><span>'+E.sensi.join(', ')+'</span></div>';
  h+='</div>';
  if(E.dif.length)h+='<div><div class="label">Difese</div><div class="txt">'+E.dif.map(x=>'<p>'+rich(x)+'</p>').join('')+'</div></div>';
  if(E.capac.length)h+='<div><div class="label">Capacità</div><div class="txt">'+E.capac.map(x=>'<p>'+rich(x)+'</p>').join('')+'</div></div>';
  const note=[];if(E.L>=9)note.push('Multiattacco: '+(E.nTot>=3?'secondari a −2':'attacco extra con il primario a −5'));
  note.push('Guarigione limitata: '+(has('cavalca_eidolon')?'con il cavalca eidolon ha Punti Fatica e guarigione naturale':'solo Punti Ferita, niente guarigione naturale'));
  h+='<div class="note">'+note.map(esc).join(' · ')+'</div></div>';
  return h;
}
function scegliEvo(E){
  const L=E.L;const f=S.forma;
  let h='<div class="card"><div class="sheetHead"><h2>Aggiungi evoluzione</h2><button class="btn sm" data-close>Chiudi</button></div><input class="search" id="evoQ" placeholder="Cerca…" style="margin:10px 0"><div id="evoRes"></div></div>';
  modal(h);
  const draw=q=>{
    let o='';
    for(const c of [1,2,3,4]){
      const l=C.evoluzioni.filter(d=>d.costo===c&&(!q||d.nome.toLowerCase().includes(q)||d.testo.toLowerCase().includes(q)));
      if(!l.length)continue;
      o+='<div class="catHead"><h3>Da '+c+' punt'+(c===1?'o':'i')+'</h3></div><div class="list">';
      for(const d of l){
        const n=E.ev.filter(e=>e.id===d.id).length;const mx=maxSel(d,L);
        let why='';if(d.lv&&L<d.lv)why='dal '+d.lv+'°';else if(d.forme&&!d.forme.includes(f))why='forma';else if(n>=mx)why=n?'già presa':'';
        o+='<button class="item'+(why?' locked':'')+'" data-add="'+d.id+'"><span><b>'+esc(d.nome)+'</b>'+(d.requisiti?'<br><span class="meta">Requisiti: '+esc(d.requisiti)+'</span>':'')+'<br><span class="meta">'+rich(d.testo.slice(0,170))+(d.testo.length>170?'…':'')+'</span></span><span class="row">'+(why?'<span class="tag">'+why+'</span>':'')+'<span class="tag acc">'+c+'</span></span></button>';
      }
      o+='</div>';
    }
    document.getElementById('evoRes').innerHTML=o||'<p class="note">Nessuna evoluzione trovata.</p>';
    document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{S.evo.push({id:b.dataset.add});closeModal();render();}));
  };
  draw('');
  document.getElementById('evoQ').addEventListener('input',e=>draw(e.target.value.toLowerCase().trim()));
}

/* --- prediletto (Signore delle Schiere) --- */
function rPrediletto(){
  const L=lv();const g=gradoMax();
  const pool=ESTERNI.filter(e=>e.grado===g);
  const cr=ESTERNI.find(e=>e.id===S.prediletto);
  let h='<section class="panel"><div class="card"><h2>Esterno prediletto</h2><p class="txt">All\'alba scegli un esterno di grado '+ROM[g]+'. Segue le regole dell\'eidolon: si evoca con un rituale di 5 minuti e resta finché non viene congedato o esiliato.'+(L>=16?' Con Schiere congiunte puoi usare evoca esterno anche mentre è in campo.':'')+'</p>';
  h+='<div class="field"><label class="label" for="f-pred">Prediletto di oggi</label><select id="f-pred"><option value="">— scegli —</option>'+pool.map(e=>'<option value="'+e.id+'"'+(S.prediletto===e.id?' selected':'')+'>'+esc(e.nome)+'</option>').join('')+'</select></div>';
  if(cr&&cr.grado!==g)h+='<p class="warnT note">Il prediletto salvato è di grado '+ROM[cr.grado]+': al tuo livello il grado massimo è '+ROM[g]+'.</p>';
  h+='</div>';
  if(L>=10){
    const pv=L>=18?4:2;const sp=S.vincolo.reduce((s,id)=>s+(EVO[id]?.costo||0),0);
    h+='<div class="card"><h2>Vincolo prediletto</h2><div class="pebar'+(sp>pv?' over':'')+'" style="position:static"><span>Punti evoluzione</span><b>'+sp+' / '+pv+'</b></div><div class="list" style="margin-top:8px">'+
      S.vincolo.map((id,i)=>'<div class="evoRow"><div><b>'+esc(EVO[id].nome)+'</b><div class="note">'+rich(EVO[id].testo.slice(0,140))+'</div></div><div class="row"><span class="tag acc">'+EVO[id].costo+'</span><button class="btn sm" data-vrm="'+i+'">✕</button></div></div>').join('')+
      '</div><div class="field" style="margin-top:8px"><label class="label" for="f-vadd">Aggiungi</label><select id="f-vadd"><option value="">—</option>'+C.evoluzioni.filter(d=>d.costo<=pv&&!(d.lv>L)).map(d=>'<option value="'+d.id+'">'+esc(d.nome)+' ('+d.costo+')</option>').join('')+'</select></div><p class="note">Nella scheda sono applicati Armatura naturale migliorata, Aumento di caratteristica (For/Cos) e Tiri Salvezza migliorati; le altre evoluzioni sono riportate come testo.</p></div>';
  }
  if(cr){
    let x=JSON.parse(JSON.stringify(cr));
    const ext={ca:0,ts:0};S.vincolo.forEach(id=>{if(id==='armatura_naturale_migliorata')ext.ca+=2;if(id==='tiri_salvezza_migliorati')ext.ts+=1;});
    x.ca+=ext.ca;for(const k in x.ts)x.ts[k]+=ext.ts;
    if(S.vincolo.length)x.speciali=[...x.speciali,'Evoluzioni (Vincolo prediletto): '+S.vincolo.map(id=>EVO[id].nome).join(', ')];
    h+='<div class="card">'+schedaCreatura(x,x.grado,true).replace(/<b>1 min<\/b>/,'<b>fino a congedo</b>')+'</div>';
  }
  h+='</section>';main.innerHTML=h;
  document.getElementById('f-pred').addEventListener('change',e=>{S.prediletto=e.target.value||null;render();});
  const va=document.getElementById('f-vadd');va&&va.addEventListener('change',e=>{if(e.target.value)S.vincolo.push(e.target.value);render();});
  main.querySelectorAll('[data-vrm]').forEach(b=>b.addEventListener('click',()=>{S.vincolo.splice(+b.dataset.vrm,1);render();}));
}

/* --- tab Evocazioni --- */
function rEvoca(){
  const L=lv();
  if(!haEvoca()){
    const alt={profeta:'Il profeta rinuncia a evoca esterno in cambio degli incantesimi da sacerdote.',controevocatore:'Il controevocatore sostituisce evoca esterno con l\'aura di controevocazione: la trovi nella scheda Convocatore.',armonizzatore:'L\'armonizzatore sostituisce evoca esterno con le detonazioni acustiche: le trovi nella scheda Convocatore.',cavalca_eidolon:'Il cavalca eidolon sostituisce evoca esterno con l\'ordine cavalleresco.'};
    main.innerHTML='<section class="panel"><div class="card"><h2>Niente evocazioni</h2><p class="txt">'+S.archetipi.map(a=>alt[a]).filter(Boolean).join(' ')+'</p></div></section>';return;
  }
  const g=gradoMax();const um=usiMax();const rest=Math.max(0,um-(S.usiEvoca||0));
  const libro=libroEvocazioni();
  const nomeLibro=has('elementalista')?'Libro degli Elementali':has('demonologo')?'Libro delle Evocazioni (solo demoni)':'Libro delle Evocazioni';
  const bloccoEid=!has('creativo')&&!(has('signore_delle_schiere')&&L>=16)&&S.eidolonInCampo;
  let h='<section class="panel"><div class="stats"><div class="stat"><span class="label">Usi oggi</span><b>'+rest+' / '+um+'</b></div><div class="stat"><span class="label">Grado max</span><b>'+ROM[g]+'</b></div><div class="stat"><span class="label">Durata</span><b>'+durataEvoc()+'</b></div></div>';
  h+='<div class="row"><button class="btn" id="riposo">Nuovo giorno</button>'+(haEidolon()||has('signore_delle_schiere')?'<label class="check"><input type="checkbox" id="eidIn"'+(S.eidolonInCampo?' checked':'')+'><span>'+(has('signore_delle_schiere')?'Prediletto':has('creativo')?'Musa':'Eidolon')+' in campo</span></label>':'')+'</div>';
  if(bloccoEid)h+='<div class="banner warn">Non puoi usare evoca esterno mentre l\'eidolon è evocato.</div>';
  // metaevocazioni
  const metas=C.doti.filter(d=>d.meta&&nDote(d.id));
  if(metas.length)h+='<div class="card"><h2>Metaevocazione</h2><div class="note" style="margin-bottom:6px">Una sola alla volta.</div><div class="chips"><button class="chip" data-meta="" aria-pressed="'+!S.meta+'">Nessuna</button>'+metas.map(d=>'<button class="chip" data-meta="'+d.id+'" aria-pressed="'+(S.meta===d.id)+'">'+esc(d.nome.replace('Evocazioni ',''))+'</button>').join('')+'</div></div>';
  // attive
  h+='<div class="card"><h2>In campo</h2>';
  if(!S.evocati.length)h+='<p class="note">Nessuna creatura evocata.</p>';
  S.evocati.forEach((a,i)=>{const cr=[...ESTERNI,...ELEMENTALI].find(x=>x.id===a.id&&x.libro===a.libro);if(!cr)return;const m=modificatori(cr,a.grado);const max=cr.pf+m.pfDv*cr.dv;
    h+='<div class="active"><div class="row" style="justify-content:space-between"><button class="btn sm" data-apri="'+i+'"><b>'+esc(cr.nome)+'</b></button><span class="tag">'+a.round+' round</span></div>'+
      '<div class="row"><div class="hp"><button class="btn sm" data-pf="'+i+'" data-d="-5">−5</button><button class="btn sm" data-pf="'+i+'" data-d="-1">−1</button><input type="number" aria-label="PF di '+esc(cr.nome)+'" data-pfi="'+i+'" value="'+a.pf+'"><span class="note">/ '+max+'</span><button class="btn sm" data-pf="'+i+'" data-d="1">+1</button></div></div>'+
      '<div class="bar"><i class="'+(a.pf<max/2?'low':'')+'" style="width:'+Math.max(0,Math.min(100,a.pf/max*100))+'%"></i></div>'+
      '<div class="row"><button class="btn sm" data-rd="'+i+'">Fine round</button><button class="btn sm danger" data-cong="'+i+'">Congeda</button></div></div>';});
  if(S.evocati.length)h+='<div class="row" style="margin-top:8px"><button class="btn sm" id="roundAll">Fine round per tutti</button></div>';
  h+='</div>';
  // elenco
  h+='<div class="card"><h2>'+nomeLibro+'</h2><div class="chips" style="margin-bottom:8px"><button class="chip" data-gr="0" aria-pressed="'+(!S.filtroGrado)+'">Tutti</button>'+[...Array(g)].map((_,i)=>'<button class="chip" data-gr="'+(i+1)+'" aria-pressed="'+(S.filtroGrado===i+1)+'">'+ROM[i+1]+'</button>').join('')+'</div>';
  h+='<input class="search" id="evQ" placeholder="Cerca per nome o tipo…">';
  h+='<div id="evList"></div></div>';
  if(has('signore_delle_schiere')&&L>=4)h+='<div class="card"><h2>Evocazione multipla</h2><p class="txt">'+(L>=8?'Superiore: 1d4+1 esterni identici di grado '+ROM[Math.max(1,g-2)]+' · ':'')+'1d3 esterni identici di grado '+ROM[Math.max(1,g-1)]+(L>=20?' (sempre il massimo)':'')+'. Tocca un esterno del grado giusto e scegli "Evoca in gruppo".</p></div>';
  h+='</section>';
  main.innerHTML=h;
  const drawList=q=>{
    const gr=S.filtroGrado;let o='';
    for(let x=g;x>=1;x--){
      if(gr&&gr!==x)continue;
      const l=libro.filter(e=>e.grado===x&&(!q||(e.nome+' '+e.tipo).toLowerCase().includes(q)));
      if(!l.length)continue;
      o+='<div class="catHead"><h3>Grado '+ROM[x]+'</h3><span class="note">'+l.length+'</span></div><div class="list">';
      for(const e of l){const last=S.ultimo&&S.ultimo.id===e.id&&S.ultimo.libro===e.libro;
        o+='<button class="item'+(last?' locked':'')+'" data-cr="'+e.id+'" data-lb="'+e.libro+'"><span><b>'+esc(e.nome)+'</b><br><span class="meta">'+esc(e.tipo)+' · '+esc(e.taglia)+' · '+e.dv+' DV</span></span><span class="row">'+(last?'<span class="tag">appena evocato</span>':'')+'<span class="tag">PF '+e.pf+'</span><span class="tag">CA '+e.ca+'</span></span></button>';}
      o+='</div>';
    }
    document.getElementById('evList').innerHTML=o||'<p class="note">Nessuna creatura trovata.</p>';
    document.querySelectorAll('[data-cr]').forEach(b=>b.addEventListener('click',()=>apriCreatura(b.dataset.cr,b.dataset.lb)));
  };
  drawList('');
  document.getElementById('evQ').addEventListener('input',e=>drawList(e.target.value.toLowerCase().trim()));
  const on=(id,fn)=>{const el=document.getElementById(id);el&&el.addEventListener('click',fn);};
  on('riposo',()=>{S.usiEvoca=0;S.ultimo=null;S.usiArch=0;render();});
  const ei=document.getElementById('eidIn');ei&&ei.addEventListener('change',e=>{S.eidolonInCampo=e.target.checked;if(e.target.checked&&!has('creativo')&&!(has('signore_delle_schiere')&&lv()>=16))S.evocati=[];render();});
  on('roundAll',()=>{S.evocati.forEach(a=>a.round--);S.evocati=S.evocati.filter(a=>a.round>0);render();});
  main.querySelectorAll('[data-meta]').forEach(b=>b.addEventListener('click',()=>{S.meta=b.dataset.meta||null;render();}));
  main.querySelectorAll('[data-gr]').forEach(b=>b.addEventListener('click',()=>{S.filtroGrado=+b.dataset.gr;render();}));
  main.querySelectorAll('[data-pf]').forEach(b=>b.addEventListener('click',()=>{S.evocati[+b.dataset.pf].pf+= +b.dataset.d;render();}));
  main.querySelectorAll('[data-pfi]').forEach(b=>b.addEventListener('change',()=>{S.evocati[+b.dataset.pfi].pf=+b.value;render();}));
  main.querySelectorAll('[data-rd]').forEach(b=>b.addEventListener('click',()=>{const a=S.evocati[+b.dataset.rd];a.round--;if(a.round<=0)S.evocati.splice(+b.dataset.rd,1);render();}));
  main.querySelectorAll('[data-cong]').forEach(b=>b.addEventListener('click',()=>{S.evocati.splice(+b.dataset.cong,1);render();}));
  main.querySelectorAll('[data-apri]').forEach(b=>b.addEventListener('click',()=>{const a=S.evocati[+b.dataset.apri];const cr=[...ESTERNI,...ELEMENTALI].find(x=>x.id===a.id&&x.libro===a.libro);modal('<div class="card"><div class="sheetHead"><span></span><button class="btn sm" data-close>Chiudi</button></div>'+schedaCreatura(cr,a.grado,true)+'</div>');}));
}
function apriCreatura(id,lb){
  const cr=[...ESTERNI,...ELEMENTALI].find(x=>x.id===id&&x.libro===lb);const L=lv();
  const um=usiMax(),rest=um-(S.usiEvoca||0);
  const bloccoEid=!has('creativo')&&!(has('signore_delle_schiere')&&L>=16)&&S.eidolonInCampo;
  const last=S.ultimo&&S.ultimo.id===id&&S.ultimo.libro===lb;
  let motivo=rest<=0?'Usi giornalieri esauriti':bloccoEid?'L\'eidolon è in campo':last?'Non puoi evocare lo stesso esterno due volte di fila':'';
  const g=gradoMax();
  const gruppo=has('signore_delle_schiere')&&L>=4&&(cr.grado===g-1||(L>=8&&cr.grado===g-2));
  let h='<div class="card"><div class="sheetHead"><span></span><button class="btn sm" data-close>Chiudi</button></div>'+schedaCreatura(cr,cr.grado,true)+
    '<div class="row" style="margin-top:12px"><button class="btn pri" id="evoca"'+(motivo?' disabled':'')+'>Evoca</button>'+(gruppo?'<button class="btn" id="evocaG"'+(motivo?' disabled':'')+'>Evoca in gruppo</button>':'')+(motivo?'<span class="note warnT">'+motivo+'</span>':'')+'</div></div>';
  modal(h);
  const go=n=>{const m=modificatori(cr,cr.grado);const pf=cr.pf+m.pfDv*cr.dv;S.usiEvoca=(S.usiEvoca||0)+1;
    S.evocati=[];
    for(let i=0;i<n;i++)S.evocati.push({id:cr.id,libro:cr.libro,grado:cr.grado,pf,round:roundsEvoc()});
    S.ultimo={id:cr.id,libro:cr.libro};closeModal();render();};
  document.getElementById('evoca').addEventListener('click',()=>go(1));
  const eg=document.getElementById('evocaG');
  eg&&eg.addEventListener('click',()=>{const sup=cr.grado===g-2;let n=sup?(L>=20?5:Math.floor(Math.random()*4)+2):(L>=20?3:Math.floor(Math.random()*3)+1);go(n);});
}

/* ---------- modale ---------- */
const M=document.getElementById('modal');
function modal(h){M.innerHTML='<div class="overlay" role="dialog" aria-modal="true">'+h+'</div>';M.querySelector('.overlay').addEventListener('click',e=>{if(e.target.classList.contains('overlay')||e.target.hasAttribute('data-close'))closeModal();});}
function closeModal(){M.innerHTML='';}
function conferma(testo,ok,fn){modal('<div class="card"><p>'+esc(testo)+'</p><div class="row"><button class="btn danger" id="okC">'+ok+'</button><button class="btn" data-close>Annulla</button></div></div>');document.getElementById('okC').addEventListener('click',()=>{closeModal();fn();});}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
